<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6.2cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .pool {
          flex: 1; display: flex; flex-direction: column; justify-content: center;
          gap: 1.6cqh; min-height: 0; width: 92cqw;
        }
        #f-{{ scene_id }} .lane {
          display: grid; grid-template-columns: 16cqw 1fr; gap: 1.6cqw;
          align-items: stretch; min-height: 9cqh;
        }
        #f-{{ scene_id }} .who {
          border-radius: var(--tile-radius); background: var(--ink); color: var(--cream);
          display: flex; align-items: center; justify-content: center;
          font-size: 3.2cqmin; font-weight: 700; padding: 1cqh 0.6cqw; text-align: center;
        }
        #f-{{ scene_id }} .lane:nth-child(2) .who { background: var(--coral-deep); }
        #f-{{ scene_id }} .steps {
          display: flex; gap: 1.2cqw; align-items: center;
          border: 1px dashed var(--hairline-strong); border-radius: var(--tile-radius);
          padding: 1.2cqh 1.4cqw; min-width: 0;
        }
        #f-{{ scene_id }} .step {
          flex: 1; min-width: 0; background: var(--cream);
          border: 1px solid var(--hairline-strong); border-radius: var(--pill-radius, 999px);
          padding: 1.2cqh 1cqw; text-align: center;
          font-size: 2.6cqmin; font-weight: 600; color: var(--ink);
          display: flex; align-items: center; justify-content: center; line-height: 1.3;
        }
        #f-{{ scene_id }} .hand {
          flex: none; font-family: var(--font-mono); font-size: 2.2cqmin;
          color: var(--coral-deep); font-weight: 700;
        }
        #f-{{ scene_id }} .note { margin-top: 1.4cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .lane { grid-template-columns: 1fr; gap: 0.8cqh; }
          #f-{{ scene_id }} .who { padding: 1cqh 3cqw; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="pool" id="s-{{ scene_id }}-pool">
            {%- for raw in fields.lanes %}
            {%- set parts = raw.split("|") %}
            <div class="lane" id="s-{{ scene_id }}-lane-{{ loop.index0 }}">
              <div class="who">{{ parts[0] }}</div>
              <div class="steps">
                {%- for step in parts[1:] %}
                {% if not loop.first %}<span class="hand">⇄</span>{% endif %}
                <div class="step" id="s-{{ scene_id }}-s-{{ loop.index0 }}-{{ loop.index }}">{{ step }}</div>
                {%- endfor %}
              </div>
            </div>
            {%- endfor %}
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          var N = {{ fields.lanes | length }};

          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.28);

          // 泳道自上而下擦入，步骤按阅读顺序弹出
          var t0 = Math.min(0.9, D * 0.16);
          for (var i = 0; i < N; i++) {
            AM.wipe(tl, "#" + SID + "-lane-" + i, t0 + i * 0.28, 0.6, "top");
          }
          AM.pop(tl, '[id^="' + SID + '-s-"]', t0 + 0.35, 0.45);
          if (document.getElementById(SID + "-note")) {
            AM.wipe(tl, "#" + SID + "-note", Math.min(t0 + N * 0.28 + 0.8, D * 0.76), 0.6, "bottom");
          }
          AM.pulse(tl, "#" + SID + "-lane-" + (N - 1) + " .who", Math.min(t0 + N * 0.28 + 1.0, D * 0.82));

          {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-headline, [id^='" + SID + "-lane-'], [id^='" + SID + "-s-']", D);{% endif %}
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
