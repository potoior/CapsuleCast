<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6.2cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .stage { flex: 1; position: relative; min-height: 0; }
        #f-{{ scene_id }} .part {
          position: absolute; width: 30cqw;
          border: 2px solid var(--ink); border-radius: var(--tile-radius);
          background: var(--cream); padding: 1.8cqh 1.6cqw;
          display: flex; flex-direction: column; gap: 0.5cqh; text-align: center;
        }
        #f-{{ scene_id }} .part .p-name { font-family: var(--font-display); font-weight: 700; font-size: 3.4cqmin; color: var(--ink); }
        #f-{{ scene_id }} .part .p-sub { font-family: var(--font-mono); font-size: 1.9cqmin; color: var(--ink-faint); }
        #f-{{ scene_id }} .whole {
          position: absolute; left: 50%; top: 50%;
          transform: translate(-50%, -50%);
          width: 52cqw;
          border: 3px solid var(--coral); border-radius: var(--tile-radius);
          background: color-mix(in srgb, var(--coral) 12%, var(--cream));
          padding: 3.4cqh 3cqw; text-align: center;
          box-shadow: 0 1cqmin 4cqh color-mix(in srgb, var(--ink) 12%, transparent);
          display: flex; flex-direction: column; gap: 0.8cqh;
        }
        #f-{{ scene_id }} .whole .w-name { font-family: var(--font-display); font-weight: 700; font-size: 5.4cqmin; color: var(--coral-deep); }
        #f-{{ scene_id }} .whole .w-sub { font-family: var(--font-mono); font-size: 2.1cqmin; color: var(--ink-soft); }
        #f-{{ scene_id }} .note { margin-top: 1.2cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .part { width: 62cqw; }
          #f-{{ scene_id }} .whole { width: 78cqw; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="stage">
            {%- set NP = fields.parts | length %}
            {%- for raw in fields.parts %}
            {%- set parts = raw.split("|") %}
            {%- if NP == 2 %}
            {%- set sx = [22, 62] %}
            {%- set sy = [22, 44] %}
            {%- elif NP == 3 %}
            {%- set sx = [16, 54, 34] %}
            {%- set sy = [18, 28, 44] %}
            {%- else %}
            {%- set sx = [14, 56, 18, 58] %}
            {%- set sy = [16, 22, 44, 50] %}
            {%- endif %}
            <div class="part" id="s-{{ scene_id }}-part-{{ loop.index0 }}"
              style="left: {{ sx[loop.index0] }}cqw; top: {{ sy[loop.index0] }}cqh;">
              <span class="p-name">{{ parts[0] }}</span>
              {% if parts|length > 1 and parts[1] %}<span class="p-sub">{{ parts[1] }}</span>{% endif %}
            </div>
            {%- endfor %}
            {%- set wp = fields.whole.split("|") %}
            <div class="whole" id="s-{{ scene_id }}-whole">
              <span class="w-name">{{ wp[0] }}</span>
              {% if wp|length > 1 and wp[1] %}<span class="w-sub">{{ wp[1] }}</span>{% endif %}
            </div>
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}", D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.26);
          // 分块现身 → 聚拢到中心（散开位置用 GSAP 拉回 50%/46%）
          var n = {{ fields.parts | length }};
          for (var i = 0; i < n; i++) {
            var el = document.getElementById(SID + "-part-" + i);
            var lx = el.style.left, ly = el.style.top;
            tl.fromTo(el, { opacity: 0, y: 40 * AD.flip, rotation: AD.flip * -4, transformOrigin: "50% 50%" },
              { opacity: 1, y: 0, rotation: 0, duration: 0.45 * AD.pace, ease: "back.out(1.5)" },
              D * (0.26 + 0.05 * i));
            var stage = el.parentElement;
            var sr = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
            var tx = sr.left + sr.width * 0.5 - r.width / 2
              + (i - (n - 1) / 2) * sr.width * 0.02;
            var ty = sr.top + sr.height * 0.42 - r.height / 2 + (i - (n - 1) / 2) * (r.height * 0.85);
            tl.to(el, {
              x: tx - r.left, y: ty - r.top,
              rotation: (i - (n - 1) / 2) * 7,
              duration: 0.55, ease: "power3.inOut"
            }, D * 0.52);
            // 整体登场时散块隐去（合体）
            tl.fromTo(el, { opacity: 1 }, { opacity: 0, scale: 0.86, duration: 0.32, ease: "power2.in", immediateRender: false },
              D * 0.60);
          }
          // 整体压顶
          tl.fromTo("#" + SID + "-whole",
            { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" },
            { opacity: 1, scale: 1, duration: 0.6 * AD.pace, ease: "back.out(1.5)" }, D * 0.60);
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 }, { opacity: 1, duration: 0.6 }, D * 0.72);
          }
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
