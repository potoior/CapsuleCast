<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6.2cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .tiers { flex: 1; display: grid; gap: 2cqw; align-content: center; align-items: end; min-height: 0; width: 86cqw;
          grid-template-columns: repeat({{ fields.tiers | length }}, 1fr); }
        #f-{{ scene_id }} .tier {
          position: relative;
          border: 1px solid var(--hairline-strong); border-radius: var(--tile-radius);
          background: var(--cream); padding: 2.6cqh 1.8cqw;
          display: flex; flex-direction: column; gap: 1.2cqh; min-width: 0;
        }
        #f-{{ scene_id }} .tier .t-name { font-family: var(--font-body); font-weight: 700; font-size: 2.8cqmin; color: var(--ink); }
        #f-{{ scene_id }} .tier .t-price { font-family: var(--font-display); font-weight: 700; font-size: 4.6cqmin; color: var(--ink); line-height: 1; }
        #f-{{ scene_id }} .tier .feats { display: flex; flex-direction: column; gap: 0.8cqh; }
        #f-{{ scene_id }} .tier .feat { display: flex; gap: 0.6cqw; align-items: baseline; font-family: var(--font-body); font-size: 2.1cqmin; color: var(--ink-soft); line-height: 1.3; }
        #f-{{ scene_id }} .tier .feat::before { content: "✓"; color: var(--coral); font-weight: 700; }
        #f-{{ scene_id }} .tier.hot {
          border-color: var(--coral); border-width: 2px;
          background: color-mix(in srgb, var(--coral) 8%, var(--cream));
          padding-bottom: 4cqh; transform: translateY(-2.6cqh);
        }
        #f-{{ scene_id }} .tier.hot .t-price { color: var(--coral-deep); }
        #f-{{ scene_id }} .ribbon {
          position: absolute; top: -1.8cqh; left: 50%; transform: translateX(-50%);
          font-family: var(--font-mono); font-size: 1.8cqmin; font-weight: 700; letter-spacing: 0.14em;
          color: var(--cream); background: var(--coral);
          padding: 0.5cqh 1.6cqw; border-radius: var(--pill-radius, 8px); white-space: nowrap;
        }
        #f-{{ scene_id }} .note { margin-top: 1cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .tiers { grid-template-columns: 1fr; width: 92cqw; }
          #f-{{ scene_id }} .tier.hot { transform: none; padding-bottom: 2.6cqh; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="tiers">
            {%- set NT = fields.tiers | length %}
            {%- set hot = (fields.get('hot_index') if fields.get('hot_index') is not none else (1 if NT >= 3 else 0)) %}
            {%- for raw in fields.tiers %}
            {%- set parts = raw.split("|") %}
            <div class="tier{% if loop.index0 == hot %} hot{% endif %}" id="s-{{ scene_id }}-tier-{{ loop.index0 }}">
              {% if loop.index0 == hot %}<span class="ribbon" id="s-{{ scene_id }}-rb">推荐</span>{% endif %}
              <span class="t-name">{{ parts[0] }}</span>
              <span class="t-price">{{ parts[1] if parts|length > 1 else "" }}</span>
              <div class="feats">
                {%- for ft in (parts[2] if parts|length > 2 else "").split("；") if ft.strip() %}
                <span class="feat">{{ ft.strip() }}</span>
                {%- endfor %}
              </div>
            </div>
            {%- endfor %}
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}", D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.26);
          var n = {{ fields.tiers | length }};
          var start = D * 0.28, span = D * 0.34;
          for (var i = 0; i < n; i++) {
            tl.fromTo("#" + SID + "-tier-" + i,
              { opacity: 0, y: 50 * AD.flip },
              { opacity: 1, y: 0, duration: 0.5 * AD.pace, ease: "back.out(1.3)" },
              start + (span * i) / n);
          }
          if (document.getElementById(SID + "-rb")) {
            tl.fromTo("#" + SID + "-rb", { opacity: 0, scale: 0.5, y: 10, transformOrigin: "50% 100%" },
              { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, D * 0.64);
          }
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 }, { opacity: 1, duration: 0.6 }, D * 0.72);
          }
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
