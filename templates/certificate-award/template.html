<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
<body><template>
  <style>
    {{ base_css }}

    #f-{{ scene_id }} {
      color: var(--ink);
      font-family: var(--font-body);
    }

    #f-{{ scene_id }} .cert-stage {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.2cqh;
      padding: 4.2cqh 4cqw 6.5cqh;
    }

    #f-{{ scene_id }} .cert-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4cqh;
      text-align: center;
    }

    #f-{{ scene_id }} .cert-kicker {
      font-family: var(--font-mono);
      font-size: 1.8cqmin;
      line-height: 1;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      color: var(--coral-deep);
    }

    #f-{{ scene_id }} .cert-headline {
      margin: 0;
      max-width: 86cqw;
      font-family: var(--font-display);
      font-size: 5cqmin;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: 0.02em;
      color: var(--ink);
      text-align: center;
    }

    #f-{{ scene_id }} .cert {
      position: relative;
      box-sizing: border-box;
      width: 62cqw;
      padding: 3cqh 3.4cqw;
      background: var(--tile);
      border: 1px solid var(--hairline-strong);
      border-radius: var(--tile-radius);
      box-shadow: 0 1.4cqh 3.6cqh color-mix(in srgb, var(--ink) 12%, transparent);
    }

    #f-{{ scene_id }} .cert-inner {
      position: absolute;
      inset: 1.2cqh 1.2cqw;
      border: 2px solid var(--coral);
      border-radius: calc(var(--tile-radius) * 0.7);
      opacity: 0.7;
      pointer-events: none;
    }

    #f-{{ scene_id }} .corner {
      position: absolute;
      z-index: 2;
      width: 3cqw;
      height: 3cqh;
      border: 0 solid var(--coral);
      pointer-events: none;
    }

    #f-{{ scene_id }} .corner.tl {
      top: 2.4cqh;
      left: 2.4cqw;
      border-top-width: 2px;
      border-left-width: 2px;
    }

    #f-{{ scene_id }} .corner.tr {
      top: 2.4cqh;
      right: 2.4cqw;
      border-top-width: 2px;
      border-right-width: 2px;
    }

    #f-{{ scene_id }} .corner.bl {
      bottom: 2.4cqh;
      left: 2.4cqw;
      border-bottom-width: 2px;
      border-left-width: 2px;
    }

    #f-{{ scene_id }} .corner.br {
      right: 2.4cqw;
      bottom: 2.4cqh;
      border-right-width: 2px;
      border-bottom-width: 2px;
    }

    #f-{{ scene_id }} .cert-body {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.8cqh;
    }

    #f-{{ scene_id }} .cert-title {
      font-family: var(--font-display);
      font-size: 5cqmin;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      color: var(--ink);
      white-space: nowrap;
    }

    #f-{{ scene_id }} .cert-recipient {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7cqh;
    }

    #f-{{ scene_id }} .cert-label {
      font-family: var(--font-mono);
      font-size: 1.6cqmin;
      line-height: 1.2;
      letter-spacing: 0.18em;
      color: var(--ink-faint);
    }

    #f-{{ scene_id }} .reveal {
      box-sizing: border-box;
      width: 70%;
      padding-bottom: 0.8cqh;
      overflow: hidden;
      border-bottom: 1px solid var(--hairline-strong);
    }

    #f-{{ scene_id }} .cert-name {
      font-family: var(--font-display);
      font-size: 4.6cqmin;
      font-size: min(4cqmin, 2.2cqw);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: 0.04em;
      color: var(--ink);
      white-space: nowrap;
    }

    #f-{{ scene_id }} .cert-honor {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6cqh;
    }

    #f-{{ scene_id }} .honor-award {
      font-family: var(--font-body);
      font-size: 2.8cqmin;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.06em;
      color: var(--coral-deep);
    }

    #f-{{ scene_id }} .honor-suffix {
      font-family: var(--font-body);
      font-size: 2cqmin;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.14em;
      color: var(--ink-soft);
    }

    #f-{{ scene_id }} .cert-issuer {
      box-sizing: border-box;
      width: 100%;
      margin-top: 1.5cqh;
      padding-right: 7cqw;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5cqh;
      font-family: var(--font-mono);
      font-size: 1.8cqmin;
      line-height: 1.3;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
    }

    #f-{{ scene_id }} .issuer-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: flex-end;
      gap: 0.7cqw;
    }

    #f-{{ scene_id }} .issuer-org {
      color: var(--ink-soft);
    }

    #f-{{ scene_id }} .issuer-date {
      font-size: 1.5cqmin;
      letter-spacing: 0.16em;
      color: var(--ink-faint);
    }

    #f-{{ scene_id }} .cert-seal {
      position: absolute;
      right: 7%;
      bottom: 8%;
      z-index: 3;
      box-sizing: border-box;
      width: 16cqw;
      height: 16cqw;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px double var(--coral);
      border-radius: 50%;
      color: var(--coral);
      font-family: var(--font-display);
      font-size: 3cqmin;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-indent: 0.08em;
      opacity: 0.85;
      rotate: -8deg;
      pointer-events: none;
    }

    #f-{{ scene_id }} .cert-note {
      font-family: var(--font-mono);
      font-size: 1.6cqmin;
      line-height: 1.3;
      letter-spacing: 0.16em;
      color: var(--ink-faint);
      text-align: center;
    }

    @container frame (max-aspect-ratio: 10/16) {
      #f-{{ scene_id }} .cert-stage {
        gap: 2.4cqh;
        padding: 5cqh 4cqw 8cqh;
      }

      #f-{{ scene_id }} .cert-headline {
        font-size: 5cqmin;
        max-width: 90cqw;
      }

      #f-{{ scene_id }} .cert {
        width: 92cqw;
        padding: 2.6cqh 3.2cqw;
      }

      #f-{{ scene_id }} .cert-title {
        font-size: 5cqmin;
      }

      #f-{{ scene_id }} .cert-name {
        font-size: 3.6cqmin;
      }

      #f-{{ scene_id }} .cert-issuer {
        padding-right: 12cqw;
      }

      #f-{{ scene_id }} .cert-seal {
        right: 5%;
        bottom: 5%;
        width: 22cqw;
        height: 22cqw;
        font-size: 3.4cqmin;
      }
    }
  </style>

  {% set recipient_parts = (fields.get('recipient') or '').split('|') %}
  {% set honor_parts = (fields.get('honor') or '').split('|') %}
  {% set issuer_parts = (fields.get('issuer') or '').split('|') %}
  {% set recipient_name = recipient_parts[0] | trim %}
  {% set recipient_tag = recipient_parts[1] | trim if recipient_parts | length > 1 else '' %}
  {% set honor_award = honor_parts[0] | trim %}
  {% set honor_suffix = honor_parts[1] | trim if honor_parts | length > 1 else '' %}
  {% set issuer_org = issuer_parts[0] | trim %}
  {% set issuer_action = issuer_parts[1] | trim if issuer_parts | length > 1 else '' %}
  {% set note_text = fields.get('note') or '' %}

  <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
       data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
    <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
    <div class="hf-safe">
      <div class="cert-stage">
        <div class="cert-head">
          <div class="cert-kicker" id="s-{{ scene_id }}-kicker">{{ fields.get('kicker') }}</div>
          <h1 class="cert-headline" id="s-{{ scene_id }}-headline">{{ fields.get('headline') }}</h1>
        </div>

        <div class="cert" id="s-{{ scene_id }}-cert">
          <div class="cert-inner" id="s-{{ scene_id }}-inner"></div>
          <span class="corner tl" id="s-{{ scene_id }}-corner-tl"></span>
          <span class="corner tr" id="s-{{ scene_id }}-corner-tr"></span>
          <span class="corner bl" id="s-{{ scene_id }}-corner-bl"></span>
          <span class="corner br" id="s-{{ scene_id }}-corner-br"></span>

          <div class="cert-body">
            <div class="cert-title" id="s-{{ scene_id }}-title">证书</div>

            <div class="cert-recipient">
              <div class="cert-label">兹授予{% if recipient_tag %} · {{ recipient_tag }}{% endif %}</div>
              <div class="reveal">
                <div class="cert-name" id="s-{{ scene_id }}-recipient">{{ recipient_name }}</div>
              </div>
            </div>

            <div class="cert-honor" id="s-{{ scene_id }}-honor">
              <div class="honor-award">{{ honor_award }}</div>
              {% if honor_suffix %}<div class="honor-suffix">{{ honor_suffix }}</div>{% endif %}
            </div>

            <div class="cert-issuer" id="s-{{ scene_id }}-issuer">
              <div class="issuer-line">
                <span class="issuer-org">{{ issuer_org }}</span>
                {% if issuer_action %}<span class="issuer-action">{{ issuer_action }}</span>{% endif %}
              </div>
              <div class="issuer-date">2026.10</div>
            </div>
          </div>

          <div class="cert-seal" id="s-{{ scene_id }}-seal"><span>认证</span></div>
        </div>

        {% if note_text %}
        <div class="cert-note" id="s-{{ scene_id }}-note">{{ note_text }}</div>
        {% endif %}
      </div>
    </div>
  </div>

  <script>
    (function () {
      var SID = "s-{{ scene_id }}";
      var D = {{ duration }};
      var tl = gsap.timeline({ paused: true });

      AM.pop(tl, "#" + SID + "-kicker", D * 0.06);
      AM.focus(tl, "#" + SID + "-headline", D * 0.14);

      tl.fromTo("#" + SID + "-cert",
        { y: 28, scale: 0.96, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: D * 0.14, ease: "power3.out" },
        D * 0.26
      );

      AM.wipe(tl, "#" + SID + "-inner", D * 0.34, "top");
      AM.focus(tl, "#" + SID + "-title", D * 0.42);
      AM.maskRise(tl, "#" + SID + "-recipient", D * 0.5);
      AM.stagger(tl, "#" + SID + "-honor", D * 0.58);
      AM.stagger(tl, "#" + SID + "-issuer", D * 0.64);
      AM.stamp(tl, "#" + SID + "-seal", D * 0.72);
      {% if note_text %}AM.focus(tl, "#" + SID + "-note", D * 0.8);{% endif %}

      {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-cert, #" + SID + "-seal", D);{% endif %}

      tl.to({}, { duration: D }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["{{ scene_id }}"] = tl;
    })();
  </script>
</template></body></html>
