<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .trio{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;align-content:center;min-height:0;width:92cqw;}
        #f-{{ scene_id }} .card{position:relative;border:1.5px solid var(--hairline-strong);border-radius:var(--tile-radius);background:var(--cream);padding:2.6cqh 1.6cqw;display:flex;flex-direction:column;gap:1cqh;min-width:0;}
        #f-{{ scene_id }} .card.hot{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 9%,var(--cream));}
        #f-{{ scene_id }} .card .nm{font-size:3.4cqmin;font-weight:700;color:var(--ink);}
        #f-{{ scene_id }} .card .pt{font-size:2.9cqmin;font-weight:600;color:var(--ink);line-height:1.35;}
        #f-{{ scene_id }} .card .sub{font-family:var(--font-mono);font-size:2cqmin;color:var(--ink-faint);}
        #f-{{ scene_id }} .win-badge{position:absolute;right:-1.2cqw;top:-2cqh;width:4.4cqw;height:4.4cqw;border-radius:50%;background:var(--coral);color:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:2.6cqmin;}
        #f-{{ scene_id }} .verdict{margin-top:1.8cqh;width:92cqw;padding:1.5cqh 2cqw;border-radius:var(--tile-radius);background:var(--ink);color:var(--cream);font-size:3cqmin;font-weight:600;text-align:center;}
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .trio{grid-template-columns:1fr;}
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="trio">{% for raw in fields.get("options", []) %}{% set parts = raw.split("|") %}<div class="card{% if loop.index == (fields.winner | int) %} hot{% endif %}" id="s-{{ scene_id }}-card-{{ loop.index0 }}"><span class="nm">{{ parts[0] }}</span><span class="pt">{{ parts[1] if parts|length > 1 else "" }}</span><span class="sub">{{ parts[2] if parts|length > 2 else "" }}</span>{% if loop.index == (fields.winner | int) %}<span class="win-badge" id="s-{{ scene_id }}-badge">✓</span>{% endif %}</div>{% endfor %}</div><div class="verdict" id="s-{{ scene_id }}-verdict">{{ fields.verdict }}</div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.28);
          var t0=Math.min(0.9,D*0.16);
          tl.fromTo("#"+SID+"-card-0",{opacity:0,x:-32*AD.flip},{opacity:1,x:0,duration:0.45,ease:"back.out(1.7)"},t0);
          tl.fromTo("#"+SID+"-card-1",{opacity:0,y:26},{opacity:1,y:0,duration:0.45,ease:"back.out(1.7)"},t0+0.18);
          tl.fromTo("#"+SID+"-card-2",{opacity:0,x:32*AD.flip},{opacity:1,x:0,duration:0.45,ease:"back.out(1.7)"},t0+0.36);
          AM.pop(tl,"#"+SID+"-badge",t0+0.8,0.45);
          AM.pulse(tl,"#"+SID+"-card-"+((parseInt("{{ fields.winner }}",10)||1)-1),t0+1.2);
          var tV=Math.min(t0+1.5,D*0.64);
          AM.wipe(tl,"#"+SID+"-verdict",tV,0.65,"bottom");
          AM.pulse(tl,"#"+SID+"-verdict",tV+0.7);
          if(document.getElementById(SID+"-note")){tl.fromTo("#"+SID+"-note",{opacity:0},{opacity:1,duration:0.5},Math.min(tV+0.5,D*0.8));}
          {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-headline, [id^='" + SID + "-card-'], #" + SID + "-verdict, #" + SID + "-badge", D);{% endif %}
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
