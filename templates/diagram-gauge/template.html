<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6.2cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .gauge-zone { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
        #f-{{ scene_id }} svg.gauge { width: 100%; max-height: 52cqh; }
        #f-{{ scene_id }} .g-arc { fill: none; stroke: color-mix(in srgb, var(--ink) 10%, transparent); stroke-width: 34; stroke-linecap: round; }
        #f-{{ scene_id }} .g-fill { fill: none; stroke: var(--coral); stroke-width: 34; stroke-linecap: round; }
        #f-{{ scene_id }} .g-needle { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
        #f-{{ scene_id }} .g-hub { fill: var(--ink); }
        #f-{{ scene_id }} .g-big { font-family: var(--font-display); font-weight: 700; font-size: 7.2cqmin; fill: var(--ink); text-anchor: middle; }
        #f-{{ scene_id }} .g-cap { font-family: var(--font-mono); font-size: 2.2cqmin; fill: var(--ink-faint); text-anchor: middle; letter-spacing: 0.12em; }
        #f-{{ scene_id }} .note { margin-top: 1cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="gauge-zone">
            <svg class="gauge" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid meet">
              <path class="g-arc" d="M 300 560 A 500 500 0 0 1 1300 560" />
              <path class="g-fill" id="s-{{ scene_id }}-fill" d="M 300 560 A 500 500 0 0 1 1300 560" />
              <line class="g-needle" id="s-{{ scene_id }}-needle" x1="800" y1="560" x2="800" y2="130" />
              <circle class="g-hub" cx="800" cy="560" r="16" id="s-{{ scene_id }}-hub" />
              <text class="g-big" id="s-{{ scene_id }}-big" x="800" y="470">{{ fields.value_text }}</text>
              <text class="g-cap" x="800" y="520">/ 100</text>
              {% if fields.get('low_label') %}<text class="g-cap" x="300" y="640">{{ fields.get('low_label') }}</text>{% endif %}
              {% if fields.get('high_label') %}<text class="g-cap" x="1300" y="640">{{ fields.get('high_label') }}</text>{% endif %}
            </svg>
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}", D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var PCT = Math.min(100, Math.max(0, {{ fields.value_pct }}));
          var ARC = 500 * Math.PI;  // 半周长
          var fill = document.getElementById(SID + "-fill");
          fill.style.strokeDasharray = (ARC / 2) + " " + ARC;
          fill.style.strokeDashoffset = (ARC / 2);
          fill.setAttribute("transform", "");
          var needle = document.getElementById(SID + "-needle");
          needle.style.transformOrigin = "800px 560px";
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.26);
          tl.to(fill, { strokeDashoffset: (ARC / 2) * (1 - PCT / 100), duration: D * 0.3, ease: "power3.out" }, D * 0.28);
          tl.fromTo(needle, { rotation: -90 }, { rotation: -90 + 1.8 * PCT, duration: D * 0.3, ease: "back.out(1.2)" }, D * 0.28);
          tl.fromTo("#" + SID + "-big", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" },
            { opacity: 1, scale: 1, duration: 0.5 * AD.pace, ease: "back.out(1.6)" }, D * 0.52);
          tl.fromTo("#" + SID + "-hub", { attr: { r: 0 } }, { attr: { r: 16 }, duration: 0.3 }, D * 0.26);
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 }, { opacity: 1, duration: 0.6 }, D * 0.72);
          }
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
