<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6.2cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .j-zone { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
        #f-{{ scene_id }} svg.jn { width: 100%; height: 100%; }
        #f-{{ scene_id }} .j-base { stroke: var(--hairline-strong); stroke-width: 3; }
        #f-{{ scene_id }} .j-curve { fill: none; stroke: var(--coral); stroke-width: 5; stroke-linecap: round; }
        #f-{{ scene_id }} .j-area { fill: color-mix(in srgb, var(--coral) 10%, transparent); stroke: none; }
        #f-{{ scene_id }} .j-dot { fill: var(--cream); stroke: var(--coral); stroke-width: 4; }
        #f-{{ scene_id }} .j-stage { font-family: var(--font-body); font-weight: 700; font-size: 2.8cqmin; fill: var(--ink); text-anchor: middle; }
        #f-{{ scene_id }} .j-ev { font-family: var(--font-mono); font-size: 2cqmin; fill: var(--ink-faint); text-anchor: middle; }
        #f-{{ scene_id }} .note { margin-top: 1cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .j-stage { font-size: 3.4cqmin; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="j-zone">
            <svg class="jn" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}", D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var NS = "http://www.w3.org/2000/svg";
          var svg = document.querySelector("#f-{{ scene_id }} svg.jn");
          var stages = [];
          {% for raw in fields.stages -%}
          {%- set parts = raw.split("|") -%}
          stages.push({ name: {{ parts[0] | tojson }},
            ev: {{ (parts[1] if parts|length > 1 else "") | tojson }},
            emo: parseFloat({{ (parts[2] if parts|length > 2 else "50") | tojson }}) || 50 });
          {% endfor -%}
          var n = stages.length;
          var L = 150, R = 1450, BASE = 560, TOP = 150;
          function X(i) { return L + (R - L) * (n === 1 ? 0.5 : i / (n - 1)); }
          function Y(e) { return BASE - (BASE - TOP) * Math.min(100, Math.max(0, e)) / 100; }
          function el(tag, attrs, text) {
            var e = document.createElementNS(NS, tag);
            for (var k in attrs) { e.setAttribute(k, attrs[k]); }
            if (text != null) { e.textContent = text; }
            svg.appendChild(e); return e;
          }
          var base = el("line", { class: "j-base", x1: L - 30, y1: BASE, x2: R + 30, y2: BASE });
          base.id = SID + "-base";
          // 曲线（Catmull-Rom 近似：直接用平滑 path）
          var pts = [];
          for (var i = 0; i < n; i++) { pts.push([X(i), Y(stages[i].emo)]); }
          var d = "M " + pts[0][0] + " " + pts[0][1];
          for (var k = 1; k < pts.length; k++) {
            var p0 = pts[k - 1], p1 = pts[k];
            var mx = (p0[0] + p1[0]) / 2;
            d += " C " + mx + " " + p0[1] + ", " + mx + " " + p1[1] + ", " + p1[0] + " " + p1[1];
          }
          var area = el("path", { class: "j-area", d: d + " L " + pts[n - 1][0] + " " + BASE + " L " + pts[0][0] + " " + BASE + " Z", id: SID + "-area", opacity: 0 });
          var curve = el("path", { class: "j-curve", d: d, id: SID + "-curve" });
          var len = curve.getTotalLength();
          curve.style.strokeDasharray = len + " " + len;
          curve.style.strokeDashoffset = len;
          var dots = [], labels = [], evs = [];
          for (var j = 0; j < n; j++) {
            var dot = el("circle", { class: "j-dot", cx: X(j), cy: Y(stages[j].emo), r: 11, id: SID + "-d" + j, opacity: 0 });
            dots.push(dot);
            var st = el("text", { class: "j-stage", x: X(j), y: BASE + 52, id: SID + "-s" + j, opacity: 0 }, stages[j].name);
            labels.push(st);
            if (stages[j].ev) {
              var ev = el("text", { class: "j-ev", x: X(j), y: BASE + 86, id: SID + "-e" + j, opacity: 0 }, stages[j].ev);
              evs.push(ev);
            }
          }
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.26);
          tl.fromTo(base, { attr: { x2: L - 30 } }, { attr: { x2: R + 30 }, duration: 0.45, ease: "power2.out" }, D * 0.24);
          tl.fromTo(curve, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: D * 0.22, ease: "power2.inOut" }, D * 0.30);
          tl.fromTo(area, { opacity: 0 }, { opacity: 1, duration: 0.5 }, D * 0.50);
          for (var m = 0; m < n; m++) {
            var at = D * (0.30 + 0.22 * (m / Math.max(1, n - 1)));
            tl.fromTo(dots[m], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "back.out(2)" }, at);
            tl.fromTo(labels[m], { opacity: 0 }, { opacity: 1, duration: 0.3 }, at + 0.1);
            if (m < evs.length || document.getElementById(SID + "-e" + m)) {
              tl.fromTo("#" + SID + "-e" + m, { opacity: 0 }, { opacity: 1, duration: 0.3 }, at + 0.16);
            }
          }
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 }, { opacity: 1, duration: 0.6 }, D * 0.72);
          }
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
