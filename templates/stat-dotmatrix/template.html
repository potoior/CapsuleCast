<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .duo { flex: 1; display: grid; grid-template-columns: 1fr 42cqw; align-items: center; gap: 2cqw; min-height: 0; width: 92cqw; }
        #f-{{ scene_id }} .pct { font-family: var(--font-display); font-size: 11cqmin; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
        #f-{{ scene_id }} .ilab { font-size: 3.4cqmin; font-weight: 600; margin-top: 0.8cqh; }
        #f-{{ scene_id }} .dtl { font-family: var(--font-mono); font-size: 2.2cqmin; color: var(--ink-faint); margin-top: 0.5cqh; }
        #f-{{ scene_id }} .dgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 0.7cqw; }
        #f-{{ scene_id }} .dot { width: 1.6cqw; height: 1.6cqw; border-radius: 50%; background: var(--tile); }
        #f-{{ scene_id }} .dot.lit { background: var(--coral); }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .duo { grid-template-columns: 1fr; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="duo">
            <div>
              <div class="pct" id="s-{{ scene_id }}-pct">0%</div>
              <div class="ilab">{{ fields.item_label }}</div>
              <div class="dtl">{{ fields.detail }}</div>
            </div>
            <div class="dgrid" id="s-{{ scene_id }}-grid"></div>
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.28);
          var P = parseInt("{{ fields.pct }}", 10) || 0;
          for (var i = 0; i < 100; i++) {
            var s = document.createElement("span");
            s.className = "dot" + (i < P ? " lit" : "");
            s.id = SID + "-dot-" + i;
            document.getElementById(SID + "-grid").appendChild(s);
          }
          AM.countUp(tl, "#" + SID + "-pct", 0, P, Math.min(0.9, D * 0.2), Math.min(1.5, D * 0.32), "%");
          for (var i = 0; i < P; i++) {
            tl.fromTo("#" + SID + "-dot-" + i, { opacity: 0, scale: 0.4 },
              { opacity: 1, scale: 1, duration: 0.15, ease: "back.out(2)" },
              0.9 + (D * 0.38 * i) / Math.max(1, P));
          }
          AM.pulse(tl, "#" + SID + "-dot-" + (P - 1), 0.9 + D * 0.38 + 0.2);
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 },
              { opacity: 1, duration: 0.5 }, Math.min(0.9 + D * 0.38 + 0.8, D * 0.8));
          }
          {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-headline, #" + SID + "-pct, #" + SID + "-grid, [id^='" + SID + "-dot-']", D);{% endif %}
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
