<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .duo { flex: 1; display: grid; grid-template-columns: 1fr 22cqw; align-items: center; gap: 2cqw; min-height: 0; width: 90cqw; margin: 0 auto; }
        #f-{{ scene_id }} .curn { font-family: var(--font-display); font-size: 9cqmin; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
        #f-{{ scene_id }} .unit { font-family: var(--font-mono); font-size: 2.6cqmin; color: var(--ink-faint); margin-top: 0.6cqh; }
        #f-{{ scene_id }} .goalrow { font-family: var(--font-mono); font-size: 2.2cqmin; color: var(--ink-faint); margin-top: 1cqh; }
        #f-{{ scene_id }} .verdict { margin-top: 1.8cqh; padding: 1.5cqh 2cqw; border-radius: var(--tile-radius); background: var(--ink); color: var(--cream); font-size: 2.9cqmin; font-weight: 600; }
        #f-{{ scene_id }} .twrap { position: relative; height: 62cqh; display: flex; justify-content: center; }
        #f-{{ scene_id }} .tube { position: relative; width: 10cqw; height: 52cqh; border: 1.5px solid var(--hairline-strong); border-radius: 5cqw; padding: 0.8cqw; margin-top: 4cqh; background: var(--cream); overflow: hidden; }
        #f-{{ scene_id }} .bulb { position: absolute; top: 1cqh; width: 5cqw; height: 5cqw; border-radius: 50%; background: var(--ink); left: 50%; transform: translateX(-50%); }
        #f-{{ scene_id }} .tube .fill { position: absolute; bottom: 0; left: 0.8cqw; right: 0.8cqw; background: var(--coral); border-radius: 3cqw; transform-origin: 50% 100%; }
        #f-{{ scene_id }} .tick { position: absolute; right: 100%; margin-right: 1cqw; display: flex; align-items: center; gap: 0.5cqw; white-space: nowrap; }
        #f-{{ scene_id }} .tick .tl { width: 2cqw; height: 1.5px; background: var(--hairline-strong); }
        #f-{{ scene_id }} .tick .tt { font-family: var(--font-mono); font-size: 1.8cqmin; color: var(--ink-faint); }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .duo { grid-template-columns: 1fr; }
          #f-{{ scene_id }} .twrap { height: 38cqh; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="duo"><div><div class="curn" id="s-{{ scene_id }}-current">0</div><div class="unit">{{ fields.unit }}</div><div class="goalrow" id="s-{{ scene_id }}-goalrow">目标 {{ fields.goal }} {{ fields.unit }}</div><div class="verdict" id="s-{{ scene_id }}-verdict">{{ fields.verdict }}</div></div><div class="twrap"><div class="tube" id="s-{{ scene_id }}-tube"><div class="fill" id="s-{{ scene_id }}-fill"></div></div></div></div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.28);
          var CUR = parseFloat("{{ fields.current }}") || 0, GOAL = parseFloat("{{ fields.goal }}") || 1;
          var ratio = Math.max(0.04, Math.min(1, CUR / GOAL));
          var fillEl = document.getElementById(SID + "-fill");
          fillEl.style.height = (ratio * 100) + "%";
          var MS = {{ fields.milestones | tojson }};
          var tube = document.getElementById(SID + "-tube");
          for (var i = 0; i < MS.length; i++) {
            var v = parseFloat(String(MS[i]).split("|")[0]) || 0;
            var tk = document.createElement("div");
            tk.className = "tick";
            tk.id = SID + "-tick-" + i;
            tk.style.bottom = (Math.min(1, v / GOAL) * 92) + "%";
            tk.innerHTML = '<span class="tl"></span><span class="tt">' + String(MS[i]).split("|").slice(1).join("|") + '</span>';
            tube.appendChild(tk);
          }
          var t0 = Math.min(0.9, D * 0.16);
          var grow = Math.min(1.4, D * 0.3);
          tl.fromTo("#" + SID + "-fill", { scaleY: 0 }, { scaleY: 1, duration: grow, ease: "power2.inOut" }, t0 + 0.3);
          AM.countUp(tl, "#" + SID + "-current", 0, CUR, t0 + 0.3, grow);
          tl.fromTo("#" + SID + "-goalrow", { opacity: 0 }, { opacity: 1, duration: 0.5 }, t0 + 0.5);
          for (var i = 0; i < MS.length; i++) {
            var v2 = parseFloat(String(MS[i]).split("|")[0]) || 0;
            AM.pop(tl, "#" + SID + "-tick-" + i, t0 + 0.3 + grow * Math.min(1, v2 / GOAL), 0.4);
          }
          var tV = Math.min(t0 + grow + 0.9, D * 0.66);
          AM.wipe(tl, "#" + SID + "-verdict", tV, 0.65, "bottom");
          AM.pulse(tl, "#" + SID + "-verdict", tV + 0.7);
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 }, { opacity: 1, duration: 0.5 }, Math.min(tV + 0.5, D * 0.8));
          }
          {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-headline, #" + SID + "-current, #" + SID + "-goalrow, #" + SID + "-verdict, #" + SID + "-fill, [id^='" + SID + "-tick-']", D);{% endif %}
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
