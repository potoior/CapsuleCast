<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>{{ scene_id }}</title>
  </head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .wrap {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 0;
        }
        #f-{{ scene_id }} .card {
          position: relative;
          width: 64cqw;
          padding: 5cqh 4cqw 5.5cqh;
          display: flex;
          flex-direction: column;
          gap: 2.2cqh;
        }
        #f-{{ scene_id }} .card .tag {
          position: absolute;
          top: -1.4cqmin;
          right: 3cqw;
          background: var(--navy);
          color: var(--cream);
          font-family: var(--font-mono);
          font-size: 1.9cqmin;
          letter-spacing: 0.14em;
          padding: 0.7cqh 1.4cqw;
          border-radius: 0.5cqmin;
        }
        #f-{{ scene_id }} .term {
          font-family: var(--font-display);
          font-size: 8.4cqmin;
          line-height: 1;
          letter-spacing: -0.01em;
        }
        #f-{{ scene_id }} .term-en {
          font-family: var(--font-mono);
          font-size: 2.2cqmin;
          letter-spacing: 0.22em;
          color: var(--ink-soft);
        }
        #f-{{ scene_id }} .rule {
          width: 30%;
          transform: scaleX(0);
        }
        #f-{{ scene_id }} .def {
          font-family: var(--font-body);
          font-size: 3.1cqmin;
          line-height: 1.6;
          color: var(--ink);
        }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .card { width: 86cqw; }
          #f-{{ scene_id }} .def { font-size: 3.6cqmin; }
        }
      </style>

      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>

        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker">
            <span class="hf-spike"></span> {{ fields.kicker }}
          </div>
          <div class="wrap">
            <div class="hf-card card" id="s-{{ scene_id }}-card">
              <div class="tag" id="s-{{ scene_id }}-tag">{{ fields.tag }}</div>
              <div class="term" id="s-{{ scene_id }}-term">{{ fields.term }}</div>
              <div class="term-en" id="s-{{ scene_id }}-term-en">{{ fields.term_en }}</div>
              <div class="hf-rule rule" id="s-{{ scene_id }}-rule"></div>
              <div class="def" id="s-{{ scene_id }}-def">{{ fields.definition }}</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);

          tl.fromTo("#" + SID + "-card",
            { opacity: 0, y: 52, scale: 0.985 },
            { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: "power3.out" },
            Math.min(0.45, D * 0.14));

          tl.fromTo("#" + SID + "-term", { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            Math.min(0.85, D * 0.24));
          tl.fromTo("#" + SID + "-term-en", { opacity: 0 },
            { opacity: 1, duration: 0.5 }, Math.min(1.05, D * 0.3));
          tl.to("#" + SID + "-rule", { scaleX: 1, duration: 0.85, ease: "power3.inOut" },
            Math.min(1.25, D * 0.36));
          tl.fromTo("#" + SID + "-def", { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            Math.min(1.55, D * 0.44));
          tl.fromTo("#" + SID + "-tag", { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            Math.min(1.9, D * 0.55));

          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
