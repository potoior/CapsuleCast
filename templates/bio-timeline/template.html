<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .duo {
          flex: 1; display: grid; grid-template-columns: 30cqw 1fr;
          align-items: center; gap: 3cqw; min-height: 0; width: 92cqw;
        }
        #f-{{ scene_id }} .who {
          border: 2px solid var(--ink); border-radius: var(--tile-radius);
          background: var(--ink); color: var(--cream);
          padding: 3.4cqh 1.6cqw; text-align: center;
          display: flex; flex-direction: column; gap: 0.6cqh; min-width: 0;
        }
        #f-{{ scene_id }} .who .p { font-family: var(--font-display); font-size: 4.6cqmin; font-weight: 700; line-height: 1.2; }
        #f-{{ scene_id }} .who .k { font-family: var(--font-mono); font-size: 1.8cqmin; letter-spacing: 0.22em; opacity: 0.75; }
        #f-{{ scene_id }} .line { position: relative; padding-left: 4cqw; }
        #f-{{ scene_id }} .spine {
          position: absolute; left: 1cqw; top: 6%; bottom: 6%; width: 1.5px;
          background: var(--hairline-strong); transform-origin: 50% 0%;
        }
        #f-{{ scene_id }} .ms { position: relative; padding: 1cqh 0 1cqh 2cqw; }
        #f-{{ scene_id }} .ms .dot {
          position: absolute; left: -3.3cqw; top: 1.7cqh; width: 1.8cqw; height: 1.8cqw;
          border-radius: 50%; background: var(--coral); border: 2px solid var(--cream);
        }
        #f-{{ scene_id }} .ms .yr { font-family: var(--font-mono); font-size: 2.4cqmin; font-weight: 700; color: var(--coral-deep); }
        #f-{{ scene_id }} .ms b { display: block; font-size: 2.9cqmin; font-weight: 600; color: var(--ink); line-height: 1.35; margin-top: 0.2cqh; }
        #f-{{ scene_id }} .note { margin-top: 1.2cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; text-align: center; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .duo { grid-template-columns: 1fr; width: 92cqw; }
          #f-{{ scene_id }} .who { padding: 2cqh 3cqw; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="duo">
            <div class="who" id="s-{{ scene_id }}-who">
              <span class="k">PERSON</span>
              <span class="p">{{ fields.person }}</span>
            </div>
            <div class="line" id="s-{{ scene_id }}-line">
              <div class="spine" id="s-{{ scene_id }}-spine"></div>
              {%- for raw in fields.milestones %}
              {%- set parts = raw.split("|") %}
              <div class="ms" id="s-{{ scene_id }}-ms-{{ loop.index0 }}">
                <span class="dot" id="s-{{ scene_id }}-dot-{{ loop.index0 }}"></span>
                <span class="yr">{{ parts[0] }}</span>
                <b>{{ parts[1] if parts|length > 1 else "" }}</b>
              </div>
              {%- endfor %}
            </div>
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          var N = {{ fields.milestones | length }};

          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.28);

          // 人物名牌聚焦 → 生命线生长 → 里程碑逐段点亮
          var t0 = Math.min(0.9, D * 0.16);
          AM.focus(tl, "#" + SID + "-who", t0, 0.8);
          tl.fromTo("#" + SID + "-spine", { scaleY: 0 },
            { scaleY: 1, duration: Math.min(1.2, D * 0.3), ease: "power2.inOut" }, t0 + 0.4);
          var span = Math.max(0.8, D * 0.36);
          for (var i = 0; i < N; i++) {
            var at = t0 + 0.6 + (span * i) / Math.max(1, N - 1);
            tl.fromTo("#" + SID + "-ms-" + i, { opacity: 0, x: 24 * AD.flip },
              { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at);
            AM.pop(tl, "#" + SID + "-dot-" + i, at + 0.08, 0.35);
          }
          AM.pulse(tl, "#" + SID + "-dot-" + (N - 1), t0 + 0.6 + span + 0.3);
          if (document.getElementById(SID + "-note")) {
            AM.wipe(tl, "#" + SID + "-note", Math.min(t0 + span + 1.4, D * 0.8), 0.6, "bottom");
          }

          {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-headline, #" + SID + "-who, #" + SID + "-spine, [id^='" + SID + "-ms-'], [id^='" + SID + "-dot-']", D);{% endif %}
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
