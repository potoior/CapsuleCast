<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>{{ scene_id }}</title>
  </head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline {
          font-family: var(--font-display);
          font-size: 6.2cqmin;
          margin-top: 3cqh;
        }
        #f-{{ scene_id }} .quad-zone {
          margin-top: 3cqh;
          display: grid;
          grid-template-columns: auto 1fr;
          grid-template-rows: 1fr auto;
          gap: 1cqh 1.2cqw;
          width: 86cqw;
          flex: 1;
          min-height: 0;
        }
        #f-{{ scene_id }} .y-axis {
          grid-row: 1; grid-column: 1;
          display: flex; align-items: center; justify-content: center;
        }
        #f-{{ scene_id }} .y-axis span {
          writing-mode: vertical-rl; transform: rotate(180deg);
          font-family: var(--font-mono); font-size: 2.2cqmin;
          color: var(--coral-deep); letter-spacing: 0.2em; white-space: nowrap;
        }
        #f-{{ scene_id }} .grid {
          grid-row: 1; grid-column: 2;
          display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
          gap: 1.4cqh 1.4cqw;
          min-height: 0;
        }
        #f-{{ scene_id }} .q {
          border: 2px solid var(--hairline-strong);
          border-radius: var(--tile-radius);
          background: var(--cream);
          padding: 2cqh 1.8cqw;
          display: flex; flex-direction: column; justify-content: center;
          min-height: 0;
        }
        #f-{{ scene_id }} .q.hot {
          border-color: var(--coral); background: var(--coral-soft);
        }
        #f-{{ scene_id }} .q .q-name {
          font-family: var(--font-body); font-weight: 700;
          font-size: 3.2cqmin; color: var(--ink); line-height: 1.25;
        }
        #f-{{ scene_id }} .q .q-sub {
          margin-top: 0.9cqh;
          font-family: var(--font-mono); font-size: 1.9cqmin;
          color: var(--ink-faint); letter-spacing: 0.04em;
        }
        #f-{{ scene_id }} .x-axis {
          grid-row: 2; grid-column: 2;
          text-align: center; padding-top: 0.6cqh;
          font-family: var(--font-mono); font-size: 2.2cqmin;
          color: var(--coral-deep); letter-spacing: 0.2em;
        }
        #f-{{ scene_id }} .note {
          margin-top: 1.2cqh; font-family: var(--font-mono);
          font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em;
        }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .quad-zone { width: 92cqw; }
          #f-{{ scene_id }} .q .q-name { font-size: 3.8cqmin; }
        }
      </style>

      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>

        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker">
            <span class="hf-spike"></span> {{ fields.kicker }}
          </div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="quad-zone">
            <div class="y-axis"><span>{{ fields.y_label }}</span></div>
            <div class="grid">
              {%- for raw in fields.quadrants %}
              {%- set parts = raw.split("|") %}
              <div class="q{% if loop.index == 2 %} hot{% endif %}" id="s-{{ scene_id }}-q-{{ loop.index0 }}">
                <div class="q-name">{{ parts[0] }}</div>
                {% if parts|length > 1 and parts[1] %}<div class="q-sub">{{ parts[1] }}</div>{% endif %}
              </div>
              {%- endfor %}
            </div>
            <div class="x-axis" id="s-{{ scene_id }}-x">{{ fields.x_label }}</div>
          </div>
          {% if fields.get('note') %}
          <div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>
          {% endif %}
        </div>
      </div>

      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.26);
          tl.fromTo("#" + SID + "-x", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);

          // 四象限依次浮现：左上 → 右上(重点) → 左下 → 右下
          var order = [0, 1, 2, 3];
          var start = D * 0.24, span = D * 0.4;
          for (var k = 0; k < order.length; k++) {
            var at = start + (span * k) / order.length;
            tl.fromTo("#" + SID + "-q-" + order[k],
              { opacity: 0, y: 22, scale: 0.97 },
              { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, at);
          }
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 },
              { opacity: 1, duration: 0.6 }, D * 0.72);
          }
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
