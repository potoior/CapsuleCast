<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6.2cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .board { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.6cqh; min-height: 0; width: 82cqw; }
        #f-{{ scene_id }} .row {
          display: flex; align-items: center; gap: 2cqw;
          padding: 1.4cqh 2cqw; border-radius: var(--tile-radius);
          border: 1px solid var(--hairline);
        }
        #f-{{ scene_id }} .row .no {
          font-family: var(--font-display); font-weight: 700;
          font-size: 4.6cqmin; line-height: 1; color: var(--ink-faint);
          font-variant-numeric: tabular-nums; flex: none; width: 7cqw;
          letter-spacing: -0.03em;
        }
        #f-{{ scene_id }} .row .name { font-family: var(--font-body); font-weight: 700; font-size: 3.1cqmin; color: var(--ink); }
        #f-{{ scene_id }} .row .sub { margin-left: auto; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); }
        #f-{{ scene_id }} .row.champ {
          border-color: var(--coral);
          background: color-mix(in srgb, var(--coral) 10%, var(--cream));
          padding: 2cqh 2cqw;
        }
        #f-{{ scene_id }} .row.champ .no { font-size: 7.4cqmin; color: var(--coral); width: 9cqw; }
        #f-{{ scene_id }} .row.champ .name { font-size: 3.6cqmin; color: var(--coral-deep); }
        #f-{{ scene_id }} .note { margin-top: 1.2cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .board { width: 92cqw; }
          #f-{{ scene_id }} .row .no { font-size: 6cqmin; width: 10cqw; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="board">
            {%- for raw in fields.get('items') %}
            {%- set parts = raw.split("|") %}
            <div class="row{% if loop.index0 == 0 %} champ{% endif %}" id="s-{{ scene_id }}-row-{{ loop.index0 }}">
              <span class="no">{{ loop.index }}</span>
              <span class="name">{{ parts[0] }}</span>
              {% if parts|length > 1 and parts[1] %}<span class="sub">{{ parts[1] }}</span>{% endif %}
            </div>
            {%- endfor %}
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}", D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.26);
          // 冠军先行，随后逐名揭晓
          var n = {{ fields.get('items') | length }};
          var start = D * 0.28, span = D * 0.36;
          for (var i = 0; i < n; i++) {
            tl.fromTo("#" + SID + "-row-" + i,
              { opacity: 0, x: 40 * AD.flip, scale: i === 0 ? 0.95 : 1 },
              { opacity: 1, x: 0, scale: 1, duration: 0.5 * AD.pace, ease: "back.out(1.4)" },
              start + (span * i) / n);
          }
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 }, { opacity: 1, duration: 0.6 }, D * 0.72);
          }
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
