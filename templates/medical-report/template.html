<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:92cqw;}
        #f-{{ scene_id }} .report{width:56cqw;background:#fff;border:1.5px solid var(--hairline-strong);box-shadow:0.6cqh 0.8cqw 0 color-mix(in srgb,var(--ink) 10%,transparent);padding:2.4cqh 2.4cqw;font-family:var(--font-mono);position:relative;}
        #f-{{ scene_id }} .r-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2.5px solid var(--ink);padding-bottom:1cqh;}
        #f-{{ scene_id }} .r-hos{font-size:2.8cqmin;font-weight:700;color:var(--ink);letter-spacing:0.1em;}
        #f-{{ scene_id }} .r-pt{font-size:2cqmin;color:var(--ink-faint);}
        #f-{{ scene_id }} .r-row{display:grid;grid-template-columns:1fr 12cqw 6cqw 14cqw;gap:1cqw;align-items:center;padding:1.1cqh 0;border-bottom:1px dashed var(--hairline-strong);font-size:2.4cqmin;color:var(--ink);}
        #f-{{ scene_id }} .r-row .nm{font-weight:700;}
        #f-{{ scene_id }} .r-row .vl{font-weight:700;font-size:2.8cqmin;font-variant-numeric:tabular-nums;text-align:right;}
        #f-{{ scene_id }} .r-row .arw{font-weight:900;text-align:center;color:var(--ink-faint);}
        #f-{{ scene_id }} .r-row.abn .arw{color:var(--coral-deep);}
        #f-{{ scene_id }} .r-row.abn .vl{color:var(--coral-deep);}
        #f-{{ scene_id }} .r-row .ref{font-size:1.9cqmin;color:var(--ink-faint);text-align:right;white-space:nowrap;}
        #f-{{ scene_id }} .r-cn{margin-top:1.6cqh;display:flex;justify-content:space-between;align-items:center;}
        #f-{{ scene_id }} .r-cn .txt{font-size:2.6cqmin;font-weight:700;color:var(--ink);}
        #f-{{ scene_id }} .stamp{width:8cqw;height:8cqw;border-radius:50%;border:0.4cqw double var(--coral-deep);color:var(--coral-deep);display:flex;align-items:center;justify-content:center;font-size:1.7cqmin;font-weight:900;transform:rotate(-12deg);text-align:center;line-height:1.2;}
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .report{width:92cqw;}
          #f-{{ scene_id }} .r-row{grid-template-columns:1fr 10cqw 5cqw 12cqw;}
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="wrap"><div class="report" id="s-{{ scene_id }}-report"><div class="r-head"><span class="r-hos">{{ fields.kicker }}报告单</span><span class="r-pt">{{ fields.patient_label }}</span></div>{% for raw in fields.get("items", []) %}{% set parts = raw.split("|") %}<div class="r-row{% if parts|length > 2 and parts[2] != 'ok' %} abn{% endif %}" id="s-{{ scene_id }}-row-{{ loop.index0 }}"><span class="nm">{{ parts[0] }}</span><span class="vl">{{ parts[1] if parts|length > 1 else "" }}</span><span class="arw">{% if parts|length > 2 %}{% if parts[2] == 'up' %}↑{% elif parts[2] == 'down' %}↓{% else %}—{% endif %}{% endif %}</span><span class="ref">{{ parts[3] if parts|length > 3 else "" }}</span></div>{% endfor %}<div class="r-cn"><span class="txt" id="s-{{ scene_id }}-cn">{{ fields.conclusion }}</span><span class="stamp" id="s-{{ scene_id }}-stamp">建议<br>复查</span></div></div></div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.28);
          var N = {{ fields.get("items", []) | length }};
          var t0 = Math.min(0.9, D * 0.16);
          tl.fromTo("#" + SID + "-report", { opacity: 0, y: -36 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, t0);
          for (var i = 0; i < N; i++) {
            tl.fromTo("#" + SID + "-row-" + i, { opacity: 0, x: -14 },
              { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, t0 + 0.4 + 0.3 * i);
          }
          AM.pop(tl, "#" + SID + "-cn", Math.min(t0 + 0.5 + 0.3 * N, D * 0.66), 0.5);
          tl.fromTo("#" + SID + "-stamp", { opacity: 0, scale: 2.4, rotation: 12 },
            { opacity: 1, scale: 1, rotation: -12, duration: 0.4, ease: "power3.in" }, Math.min(t0 + 0.7 + 0.3 * N, D * 0.74));
          AM.pulse(tl, "#" + SID + "-stamp", Math.min(t0 + 1.2 + 0.3 * N, D * 0.82));
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 },
              { opacity: 1, duration: 0.5 }, Math.min(t0 + 1.5 + 0.3 * N, D * 0.86));
          }
          {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-headline, #" + SID + "-report", D);{% endif %}
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
