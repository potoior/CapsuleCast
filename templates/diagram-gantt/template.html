<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6.2cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .gantt { flex: 1; width: 90cqw; min-height: 0; display: grid; grid-template-columns: 16cqw 1fr; gap: 1cqh 1.6cqw; align-content: center; }
        #f-{{ scene_id }} .axis-row { grid-column: 2; display: flex; justify-content: space-between; }
        #f-{{ scene_id }} .tl {
          font-family: var(--font-mono); font-size: 1.9cqmin;
          color: var(--ink-faint); letter-spacing: 0.06em;
        }
        #f-{{ scene_id }} .lane-name {
          font-family: var(--font-body); font-weight: 700; font-size: 2.6cqmin;
          color: var(--ink); align-self: center; text-align: right; min-width: 0;
        }
        #f-{{ scene_id }} .lane { position: relative; align-self: center; height: 3.4cqh; min-width: 0; }
        #f-{{ scene_id }} .lane .gridline { position: absolute; top: -1cqh; bottom: -1cqh; width: 1px; background: var(--hairline); }
        #f-{{ scene_id }} .bar {
          position: absolute; top: 0; bottom: 0;
          border-radius: var(--pill-radius, 8px);
          background: var(--tile-strong); border: 1px solid var(--hairline-strong);
        }
        #f-{{ scene_id }} .bar.hot { background: var(--coral); border-color: var(--coral); }
        #f-{{ scene_id }} .note { margin-top: 1cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .gantt { width: 94cqw; grid-template-columns: 20cqw 1fr; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="gantt">
            <div></div>
            <div class="axis-row" id="s-{{ scene_id }}-axis">
              {%- for tl in fields.time_labels %}
              <span class="tl">{{ tl }}</span>
              {%- endfor %}
            </div>
            {%- for raw in fields.tracks %}
            {%- set parts = raw.split("|") %}
            {%- set startp = (parts[1] | float) if parts|length > 1 else 0 %}
            {%- set durp = (parts[2] | float) if parts|length > 2 else 50 %}
            <div class="lane-name" id="s-{{ scene_id }}-ln-{{ loop.index0 }}">{{ parts[0] }}</div>
            <div class="lane">
              {%- for gi in range(1, fields.time_labels | length) %}
              <span class="gridline" style="left: {{ gi * (100 // (fields.time_labels | length - 1)) }}%"></span>
              {%- endfor %}
              <div class="bar{% if loop.index0 == 0 %} hot{% endif %}"
                id="s-{{ scene_id }}-bar-{{ loop.index0 }}"
                style="left: {{ startp }}%; width: {{ durp }}%;"></div>
            </div>
            {%- endfor %}
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}", D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.26);
          tl.fromTo("#" + SID + "-axis", { opacity: 0 }, { opacity: 1, duration: 0.4 }, D * 0.26);
          var n = {{ fields.tracks | length }};
          var start = D * 0.30, span = D * 0.36;
          for (var i = 0; i < n; i++) {
            var at = start + (span * i) / n;
            tl.fromTo("#" + SID + "-ln-" + i, { opacity: 0, x: 14 * AD.flip },
              { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, at);
            tl.fromTo("#" + SID + "-bar-" + i,
              { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" },
              { opacity: 1, scaleX: 1, duration: 0.5 * AD.pace, ease: "power3.out" }, at + 0.08);
          }
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 }, { opacity: 1, duration: 0.6 }, D * 0.72);
          }
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
