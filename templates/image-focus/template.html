<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>{{ scene_id }}</title>
  </head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .photo-wrap {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #f-{{ scene_id }} .photo {
          position: absolute;
          inset: -6%;
          background-size: cover;
          background-position: center;
          transform-origin: center;
        }
        {% if fields.image %}
        #f-{{ scene_id }} .photo { background-image: url("{{ fields.image }}"); }
        {% else %}
        #f-{{ scene_id }} .photo {
          background: linear-gradient(135deg, var(--tile) 0%, var(--tile-strong) 100%);
        }
        {% endif %}
        #f-{{ scene_id }} .photo-shade {
          position: absolute;
          inset: 0;
          background: linear-gradient(
            to top,
            rgba(0, 0, 0, 0.62) 0%,
            rgba(0, 0, 0, 0.28) 34%,
            rgba(0, 0, 0, 0.05) 62%,
            rgba(0, 0, 0, 0.18) 100%
          );
        }
        #f-{{ scene_id }} .text-zone {
          position: absolute;
          left: 7cqw;
          right: 7cqw;
          bottom: 24cqh;
          color: #FFFFFF;
        }
        #f-{{ scene_id }} .kicker-line {
          display: inline-flex;
          align-items: center;
          gap: 1.6cqw;
          font-family: var(--font-mono);
          font-size: 2.1cqmin;
          letter-spacing: 0.22em;
          color: #FFFFFF;
          opacity: 0.85;
        }
        #f-{{ scene_id }} .kicker-line::before {
          content: "";
          width: 3.4cqw;
          height: 0.5cqmin;
          background: var(--coral);
        }
        #f-{{ scene_id }} .headline {
          margin-top: 2.4cqh;
          font-family: var(--font-display);
          font-size: 7.6cqmin;
          font-weight: 700;
          line-height: 1.2;
          color: #FFFFFF;
          text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
          max-width: 80cqw;
        }
        #f-{{ scene_id }} .caption {
          position: absolute;
          right: 5cqw;
          bottom: 21.5cqh;
          font-family: var(--font-mono);
          font-size: 1.9cqmin;
          color: rgba(255, 255, 255, 0.72);
          letter-spacing: 0.08em;
        }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .headline { font-size: 8.6cqmin; max-width: 88cqw; }
          #f-{{ scene_id }} .text-zone { bottom: 26cqh; }
        }
      </style>

      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>

        <div class="photo-wrap" id="s-{{ scene_id }}-wrap">
          <div class="photo" id="s-{{ scene_id }}-photo"></div>
          <div class="photo-shade" id="s-{{ scene_id }}-shade"></div>
        </div>

        <div class="text-zone">
          <div class="kicker-line" id="s-{{ scene_id }}-kicker">{{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
        </div>
        {% if fields.get('caption') %}
        <div class="caption" id="s-{{ scene_id }}-cap">{{ fields.get('caption') }}</div>
        {% endif %}
      </div>

      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var tl = gsap.timeline({ paused: true });

          // ken-burns：慢推 + 微平移（对角线运镜），全片持续
          tl.fromTo("#" + SID + "-photo",
            { scale: 1.06, xPercent: -1.2, yPercent: 1.0 },
            { scale: 1.22, xPercent: 1.4, yPercent: -1.2,
              duration: D, ease: "none" }, 0);

          tl.fromTo("#" + SID + "-shade", { opacity: 0 },
            { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.05);
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 30 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.45);
          AM.focus(tl, "#" + SID + "-cap", D * 0.62, 0.8);
          {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-cap", D);{% endif %}
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
