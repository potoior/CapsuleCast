<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
<body><template>
  <style>
    {{ base_css }}
    #f-{{ scene_id }} .wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 9cqh 8cqw 20cqh;
      box-sizing: border-box;
    }
    #f-{{ scene_id }} .kicker {
      font-family: var(--font-mono);
      font-size: 1.8cqmin;
      letter-spacing: 0.18em;
      color: var(--coral-deep);
      text-align: center;
      white-space: nowrap;
    }
    #f-{{ scene_id }} .headline {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 5.2cqmin;
      line-height: 1.12;
      letter-spacing: -0.01em;
      color: var(--ink);
      text-align: center;
      width: 88cqw;
      margin-top: 1.6cqh;
    }
    #f-{{ scene_id }} .row {
      width: 84cqw;
      height: 50cqh;
      margin-top: 3cqh;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-around;
      box-sizing: border-box;
    }
    #f-{{ scene_id }} .metric {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1.2cqw;
      box-sizing: border-box;
    }
    #f-{{ scene_id }} .metric + .metric {
      border-left: 1px solid transparent;
    }
    #f-{{ scene_id }} .divider {
      position: absolute;
      left: 0;
      top: 12%;
      width: 1px;
      height: 76%;
      background: var(--hairline);
      transform-origin: center;
    }
    #f-{{ scene_id }} .m-value {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 6.4cqmin;
      line-height: 1;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      width: auto;
    }
    #f-{{ scene_id }} .metric.hot .m-value {
      color: var(--coral-deep);
    }
    #f-{{ scene_id }} .m-label {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 2.2cqmin;
      color: var(--ink-soft);
      margin-top: 1cqh;
      white-space: nowrap;
    }
    #f-{{ scene_id }} .m-sub {
      font-family: var(--font-mono);
      font-size: 1.5cqmin;
      color: var(--ink-faint);
      margin-top: 0.6cqh;
      white-space: nowrap;
    }
    #f-{{ scene_id }} .row.n4 .m-value {
      font-size: 5cqmin;
    }
    #f-{{ scene_id }} .row.n4 .metric {
      padding: 0 0.6cqw;
    }
    #f-{{ scene_id }} .note {
      font-family: var(--font-mono);
      font-size: 1.7cqmin;
      line-height: 1.4;
      color: var(--ink-faint);
      text-align: center;
      margin-top: auto;
      white-space: nowrap;
    }
    @container frame (max-aspect-ratio: 10/16) {
      #f-{{ scene_id }} .wrap {
        padding: 8cqh 7cqw 20cqh;
      }
      #f-{{ scene_id }} .headline {
        font-size: 5.2cqmin;
        width: 90cqw;
      }
      #f-{{ scene_id }} .row {
        width: 86cqw;
        height: 56cqh;
        margin-top: 1.5cqh;
        flex-direction: column;
      }
      #f-{{ scene_id }} .metric {
        flex: 1;
        width: 100%;
        padding: 1.2cqh 2cqw;
      }
      #f-{{ scene_id }} .metric + .metric {
        border-left: none;
        border-top: 1px solid transparent;
      }
      #f-{{ scene_id }} .divider {
        left: 14%;
        right: 14%;
        top: 0;
        width: auto;
        height: 1px;
      }
      #f-{{ scene_id }} .m-value {
        font-size: 6cqmin;
      }
      #f-{{ scene_id }} .row.n4 .m-value {
        font-size: 5.4cqmin;
      }
      #f-{{ scene_id }} .m-label {
        font-size: 2.6cqmin;
        margin-top: 0.6cqh;
      }
      #f-{{ scene_id }} .m-sub {
        font-size: 1.9cqmin;
        margin-top: 0.4cqh;
      }
      #f-{{ scene_id }} .note {
        font-size: 1.6cqmin;
        margin-top: 1.5cqh;
      }
    }
  </style>
  <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
       data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
    <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
    <div class="hf-safe">
      <div class="wrap">
        <div class="kicker" id="s-{{ scene_id }}-kicker">{{ fields.get('kicker') }}</div>
        <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.get('headline') }}</div>
        <div class="row{% if fields.get('items', [])|length == 4 %} n4{% endif %}" id="s-{{ scene_id }}-row">
          {% for item in fields.get('items', []) %}
          {% set parts = item.split('|') %}
          <div class="metric{% if loop.index == 2 %} hot{% endif %}" id="s-{{ scene_id }}-metric-{{ loop.index0 }}">
            <div class="m-value" id="s-{{ scene_id }}-value-{{ loop.index0 }}">{{ parts[0] if parts|length > 0 else item }}</div>
            <div class="m-label" id="s-{{ scene_id }}-label-{{ loop.index0 }}">{{ parts[1] if parts|length > 1 else '' }}</div>
            <div class="m-sub" id="s-{{ scene_id }}-sub-{{ loop.index0 }}">{{ parts[2] if parts|length > 2 else '' }}</div>
            {% if not loop.first %}
            <div class="divider" id="s-{{ scene_id }}-div-{{ loop.index0 }}"></div>
            {% endif %}
          </div>
          {% endfor %}
        </div>
        {% if fields.get('note') %}
        <div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>
        {% endif %}
      </div>
    </div>
  </div>
  <script>
    (function () {
      var SID = "s-{{ scene_id }}";
      var D = {{ duration }};
      var tl = gsap.timeline({ paused: true });
      var metricSel = "{% for item in fields.get('items', []) %}#s-{{ scene_id }}-metric-{{ loop.index0 }}{% if not loop.last %}, {% endif %}{% endfor %}";

      AM.focus(tl, "#" + SID + "-kicker", 0.1);
      AM.focus(tl, "#" + SID + "-headline", 0.25);
      AM.stagger(tl, metricSel, 0.4, 0.12);
      {% for item in fields.get('items', []) %}
      {% if not loop.first %}
      tl.fromTo("#" + SID + "-div-{{ loop.index0 }}", { scaleY: 0 }, { scaleY: 1, duration: 0.55, ease: "power2.out", transformOrigin: "center" }, 0.6 + {{ loop.index0 }} * 0.06);
      {% endif %}
      {% endfor %}
      {% if fields.get('note') %}
      AM.focus(tl, "#" + SID + "-note", 0.82 * D);
      {% endif %}
      {% if not is_last %}
      AM.exitSoft(tl, metricSel, D);
      {% endif %}

      tl.to({}, { duration: D }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["{{ scene_id }}"] = tl;
    })();
  </script>
</template></body></html>
