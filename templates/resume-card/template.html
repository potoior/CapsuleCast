<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:92cqw;}
        #f-{{ scene_id }} .cv{width:70cqw;background:#fff;border:1.5px solid var(--hairline-strong);box-shadow:0.6cqh 0.8cqw 0 color-mix(in srgb,var(--ink) 10%,transparent);display:grid;grid-template-columns:22cqw 1fr;min-height:44cqh;}
        #f-{{ scene_id }} .side{background:var(--ink);color:var(--cream);padding:2.6cqh 1.8cqw;display:flex;flex-direction:column;align-items:center;gap:1.4cqh;}
        #f-{{ scene_id }} .ava{width:10cqw;height:10cqw;border-radius:50%;border:0.4cqw solid var(--cream);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:4cqmin;font-weight:900;}
        #f-{{ scene_id }} .nm{font-family:var(--font-display);font-size:3.6cqmin;font-weight:900;}
        #f-{{ scene_id }} .rl{font-family:var(--font-mono);font-size:1.9cqmin;opacity:0.85;letter-spacing:0.1em;}
        #f-{{ scene_id }} .main{padding:2.6cqh 2.2cqw;display:flex;flex-direction:column;gap:1.6cqh;min-width:0;}
        #f-{{ scene_id }} .sec{font-family:var(--font-mono);font-size:1.8cqmin;font-weight:700;letter-spacing:0.24em;color:var(--coral-deep);border-bottom:1px solid var(--hairline-strong);padding-bottom:0.5cqh;}
        #f-{{ scene_id }} .sk{display:grid;grid-template-columns:12cqw 1fr auto;gap:1cqw;align-items:center;font-size:2.4cqmin;color:var(--ink);}
        #f-{{ scene_id }} .sk .bar{height:1.8cqh;border-radius:999px;background:var(--tile);overflow:hidden;}
        #f-{{ scene_id }} .sk .bar i{display:block;height:100%;border-radius:999px;background:var(--coral);transform-origin:0% 50%;}
        #f-{{ scene_id }} .sk .pv{font-family:var(--font-mono);font-size:2cqmin;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);}
        #f-{{ scene_id }} .ex{display:grid;grid-template-columns:12cqw 1fr;gap:1cqw;align-items:baseline;position:relative;padding-left:1.8cqw;border-left:1.5px solid var(--hairline-strong);}
        #f-{{ scene_id }} .ex .tm{font-family:var(--font-mono);font-size:1.9cqmin;color:var(--ink-faint);white-space:nowrap;}
        #f-{{ scene_id }} .ex .tx{font-size:2.4cqmin;color:var(--ink);line-height:1.4;}
        #f-{{ scene_id }} .ex .tx b{font-weight:700;}
        #f-{{ scene_id }} .ex::before{content:"";position:absolute;left:-0.5cqw;top:0.6cqh;width:0.9cqw;height:0.9cqw;border-radius:50%;background:var(--coral);}
        @container frame (max-aspect-ratio:10/16){ #f-{{ scene_id }} .cv{grid-template-columns:1fr;width:92cqw;} }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="wrap"><div class="cv" id="s-{{ scene_id }}-cv"><div class="side" id="s-{{ scene_id }}-side"><div class="ava" id="s-{{ scene_id }}-ava">{{ fields.name | truncate(1, true, "") }}</div><div class="nm" id="s-{{ scene_id }}-nm">{{ fields.name }}</div><div class="rl">{{ fields.role_label }}</div></div><div class="main"><div><div class="sec">技能</div>{% for raw in fields.get("skills", []) %}{% set parts = raw.split("|") %}<div class="sk" id="s-{{ scene_id }}-sk-{{ loop.index0 }}"><span>{{ parts[0] }}</span><span class="bar"><i id="s-{{ scene_id }}-skf-{{ loop.index0 }}"></i></span><span class="pv" id="s-{{ scene_id }}-skv-{{ loop.index0 }}">0</span></div>{% endfor %}</div><div><div class="sec">经历</div>{% for raw in fields.get("experiences", []) %}{% set parts = raw.split("|") %}<div class="ex" id="s-{{ scene_id }}-ex-{{ loop.index0 }}"><span class="tm">{{ parts[0] }}</span><span class="tx"><b>{{ parts[1] if parts|length > 1 else "" }}</b>{% if parts|length > 2 and parts[2] %} · {{ parts[2] }}{% endif %}</span></div>{% endfor %}</div></div></div></div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.28);
          var SK={{ fields.get("skills") | tojson }}; var EX={{ fields.get("experiences") | tojson }};
          for(var i=0;i<SK.length;i++){var p=parseInt(String(SK[i]).split("|")[1],10)||0; document.getElementById(SID+"-skf-"+i).style.width=Math.max(4,p)+"%";}
          var t0=Math.min(0.9,D*0.16);
          tl.fromTo("#"+SID+"-cv",{opacity:0,y:30},{opacity:1,y:0,duration:0.7,ease:"power3.out"},t0);
          tl.fromTo("#"+SID+"-ava",{opacity:0,scale:0.5},{opacity:1,scale:1,duration:0.5,ease:"back.out(2)"},t0+0.2);
          tl.fromTo("#"+SID+"-nm",{opacity:0},{opacity:1,duration:0.4},t0+0.35);
          for(var i=0;i<SK.length;i++){var p=parseInt(String(SK[i]).split("|")[1],10)||0; var at=t0+0.5+0.25*i; tl.fromTo("#"+SID+"-sk-"+i,{opacity:0,x:-14},{opacity:1,x:0,duration:0.3},at); tl.fromTo("#"+SID+"-skf-"+i,{scaleX:0},{scaleX:1,duration:0.6,ease:"power3.out"},at+0.1); AM.countUp(tl,"#"+SID+"-skv-"+i,0,p,at+0.1,0.6,"%");}
          for(var i=0;i<EX.length;i++){tl.fromTo("#"+SID+"-ex-"+i,{opacity:0,y:14},{opacity:1,y:0,duration:0.4,ease:"power3.out"},t0+0.6+0.25*SK.length+0.3*i);}
          AM.pulse(tl,"#"+SID+"-nm",Math.min(t0+1.8,D*0.8));
          if(document.getElementById(SID+"-note")){AM.wipe(tl,"#"+SID+"-note",Math.min(t0+2.2,D*0.85),0.6,"bottom");}
          {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-headline, #" + SID + "-cv", D);{% endif %}
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
