<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6.2cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .chart {
          flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
          min-height: 0; width: 88cqw; margin: 0 auto; padding-bottom: 6cqh;
        }
        #f-{{ scene_id }} .bars {
          flex: 1; display: flex; align-items: flex-end; justify-content: center;
          gap: 2.4cqw; min-height: 0; position: relative;
        }
        #f-{{ scene_id }} .bcol { width: 8cqw; display: flex; flex-direction: column; align-items: center; gap: 0.8cqh; }
        #f-{{ scene_id }} .bcol .bar {
          width: 100%; border-radius: 0.8cqw 0.8cqw 0 0;
          background: color-mix(in srgb, var(--ink) 78%, var(--cream));
          transform-origin: 50% 100%;
        }
        #f-{{ scene_id }} .bcol.you .bar { background: var(--coral); }
        #f-{{ scene_id }} .bcol .bl { font-size: 2.1cqmin; font-weight: 600; color: var(--ink); white-space: nowrap; }
        #f-{{ scene_id }} .bcol.you .bl { color: var(--coral-deep); }
        #f-{{ scene_id }} .youmark {
          position: absolute; transform: translateX(-50%);
          font-family: var(--font-mono); font-size: 2.2cqmin; font-weight: 700;
          color: var(--coral-deep); white-space: nowrap;
          display: flex; flex-direction: column; align-items: center; gap: 0.2cqh;
        }
        #f-{{ scene_id }} .youmark::after { content: "▼"; font-size: 2cqmin; line-height: 1; }
        #f-{{ scene_id }} .axisline { height: 1.5px; background: var(--ink); margin-top: 1.2cqh; }
        #f-{{ scene_id }} .axislabel {
          margin-top: 0.8cqh; font-family: var(--font-mono); font-size: 2cqmin;
          color: var(--ink-faint); letter-spacing: 0.14em; text-align: right;
        }
        #f-{{ scene_id }} .note { margin-top: 1cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; text-align: center; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .bcol { width: 12cqw; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="chart">
            <div class="bars" id="s-{{ scene_id }}-bars"></div>
            <div class="axisline" id="s-{{ scene_id }}-axisline"></div>
            <div class="axislabel">{{ fields.axis_label }}</div>
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          var bars = document.getElementById(SID + "-bars");
          var raw = {{ fields.buckets | tojson }};
          var N = raw.length, maxH = 0, hs = [];
          for (var i = 0; i < N; i++) {
            var h = parseFloat(String(raw[i]).split("|")[1] || "50") || 50;
            hs.push(h); maxH = Math.max(maxH, h);
          }
          var YOU = {{ fields.you_at | int }};
          var spanPct = 100 / Math.max(1, N);
          for (var i = 0; i < N; i++) {
            var col = document.createElement("div");
            col.className = "bcol" + (i === YOU - 1 ? " you" : "");
            col.id = SID + "-bcol-" + i;
            var bar = document.createElement("div");
            bar.className = "bar";
            bar.id = SID + "-bar-" + i;
            bar.style.height = Math.max(8, (hs[i] / maxH) * 100) + "%";
            var lab = document.createElement("div");
            lab.className = "bl";
            lab.textContent = String(raw[i]).split("|")[0];
            col.appendChild(bar); col.appendChild(lab);
            bars.appendChild(col);
          }
          var mk = document.createElement("div");
          mk.className = "youmark";
          mk.id = SID + "-youmark";
          mk.textContent = "{{ fields.you_label }}";
          mk.style.left = (((YOU - 0.5) * spanPct) * 0.86 + 7) + "%";
          mk.style.bottom = "72%";
          bars.appendChild(mk);

          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.28);

          // 竖柱从底线长出成"分布形状" → 轴线画出 → 你的位置标记砸落
          var t0 = Math.min(0.9, D * 0.16);
          var span = Math.max(0.6, D * 0.4);
          tl.fromTo("#" + SID + "-axisline", { scaleX: 0 },
            { scaleX: 1, duration: 0.5, ease: "power2.out", transformOrigin: "0% 50%" }, t0);
          for (var i = 0; i < N; i++) {
            tl.fromTo("#" + SID + "-bar-" + i, { scaleY: 0 },
              { scaleY: 1, duration: 0.55, ease: "power3.out" },
              t0 + 0.15 + (span * i) / Math.max(1, N - 1));
            tl.fromTo("#" + SID + "-bcol-" + i + " .bl", { opacity: 0 },
              { opacity: 1, duration: 0.35 }, t0 + 0.3 + (span * i) / Math.max(1, N - 1));
          }
          var tY = t0 + 0.3 + span;
          tl.fromTo("#" + SID + "-youmark", { opacity: 0, y: -26 },
            { opacity: 1, y: 0, duration: 0.5, ease: "back.out(2)" }, tY);
          AM.pulse(tl, "#" + SID + "-bar-" + (YOU - 1), tY + 0.1);
          if (document.getElementById(SID + "-note")) {
            AM.wipe(tl, "#" + SID + "-note", Math.min(tY + 0.9, D * 0.8), 0.6, "bottom");
          }

          {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-headline, #" + SID + "-axisline, [id^='" + SID + "-bar-'], [id^='" + SID + "-bcol-'], #" + SID + "-youmark", D);{% endif %}
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
