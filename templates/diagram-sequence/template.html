<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
<body><template>
  <style>
    {{ base_css }}
    #f-{{ scene_id }} .seq-wrap { position: absolute; inset: 0; }
    #f-{{ scene_id }} .seq-head {
      position: absolute;
      top: 4cqh;
      left: 0;
      right: 0;
      text-align: center;
    }
    #f-{{ scene_id }} .seq-kicker {
      font-family: var(--font-mono);
      font-size: 1.7cqmin;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--coral-deep);
      margin-bottom: 1.4cqh;
    }
    #f-{{ scene_id }} .seq-headline {
      font-family: var(--font-display);
      font-size: 5.2cqmin;
      line-height: 1.12;
      color: var(--ink);
      font-weight: 700;
    }
    #f-{{ scene_id }} .seq {
      position: absolute;
      left: 50%;
      top: 16cqh;
      width: 86cqw;
      height: 58cqh;
      margin-left: -43cqw;
    }
    #f-{{ scene_id }} .seq-actors,
    #f-{{ scene_id }} .seq-msgs {
      position: absolute;
      inset: 0;
    }
    #f-{{ scene_id }} .seq-actor {
      position: absolute;
      top: 0;
      width: 22cqw;
      margin-left: -11cqw;
      box-sizing: border-box;
      padding: 1cqh 1cqw;
      background: var(--ink);
      color: var(--cream);
      text-align: center;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 2.3cqmin;
      line-height: 1.25;
      border-radius: calc(var(--tile-radius) * 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #f-{{ scene_id }} .seq-life {
      position: absolute;
      top: 9cqh;
      bottom: 4cqh;
      width: 0;
      border-left: 1.5px dashed var(--ink-faint);
      transform-origin: top center;
    }
    #f-{{ scene_id }} .seq-msg {
      position: absolute;
      height: 0;
      margin: 0;
    }
    #f-{{ scene_id }} .seq-msgline {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 0;
      border-top: 1.5px solid var(--ink-faint);
      transform-origin: left center;
    }
    #f-{{ scene_id }} .seq-msgline::after {
      content: "";
      position: absolute;
      right: 0;
      top: -0.5cqmin;
      width: 0;
      height: 0;
      border-top: 0.5cqmin solid transparent;
      border-bottom: 0.5cqmin solid transparent;
      border-left: 1.15cqmin solid var(--ink);
    }
    #f-{{ scene_id }} .seq-msg.dir-left .seq-msgline {
      transform-origin: right center;
    }
    #f-{{ scene_id }} .seq-msg.dir-left .seq-msgline::after {
      display: none;
    }
    #f-{{ scene_id }} .seq-msg.dir-left .seq-msgline::before {
      content: "";
      position: absolute;
      left: 0;
      top: -0.5cqmin;
      width: 0;
      height: 0;
      border-top: 0.5cqmin solid transparent;
      border-bottom: 0.5cqmin solid transparent;
      border-right: 1.15cqmin solid var(--ink);
    }
    #f-{{ scene_id }} .seq-msglabel {
      position: absolute;
      left: 50%;
      bottom: 0.2cqh;
      transform: translateX(-50%);
      display: inline-block;
      padding: 0.3cqh 0.9cqw;
      background: var(--cream);
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 1.6cqmin;
      line-height: 1.25;
      white-space: nowrap;
    }
    #f-{{ scene_id }} .seq-note {
      position: absolute;
      top: 76cqh;
      left: 0;
      right: 4cqw;
      text-align: center;
      font-family: var(--font-body);
      font-size: 1.8cqmin;
      color: var(--ink-soft);
    }
    @container frame (max-aspect-ratio: 10/16) {
      #f-{{ scene_id }} .seq-headline { font-size: 6cqmin; }
      #f-{{ scene_id }} .seq {
        top: 18cqh;
        width: 92cqw;
        height: 54cqh;
        margin-left: -46cqw;
      }
      #f-{{ scene_id }} .seq-actor { width: 28cqw; margin-left: -14cqw; }
      #f-{{ scene_id }} .seq-msglabel { font-size: 1.5cqmin; padding: 0.3cqh 0.8cqw; }
      #f-{{ scene_id }} .seq-note { top: 76cqh; }
    }
  </style>
  <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
       data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
    <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
    <div class="hf-safe">
      <div class="seq-wrap">
        <div class="seq-head">
          <div class="seq-kicker" id="s-{{ scene_id }}-kicker">{{ fields.get('kicker') }}</div>
          <div class="seq-headline" id="s-{{ scene_id }}-headline">{{ fields.get('headline') }}</div>
        </div>
        <div class="seq">
          {% if (fields.get('actors')|length) == 2 %}
            {% set xs = [28, 72] %}
          {% else %}
            {% set xs = [18, 50, 82] %}
          {% endif %}
          <div class="seq-actors" id="s-{{ scene_id }}-actors">
            {% for a in fields.get('actors') %}
            <div class="seq-actor" id="s-{{ scene_id }}-actor-{{ loop.index0 }}"
                 style="left: {{ xs[loop.index0] }}%">{{ a }}</div>
            <div class="seq-life" id="s-{{ scene_id }}-life-{{ loop.index0 }}"
                 style="left: {{ xs[loop.index0] }}%"></div>
            {% endfor %}
          </div>
          <div class="seq-msgs" id="s-{{ scene_id }}-msgs">
            {% set n = fields.get('messages')|length %}
            {% for m in fields.get('messages') %}
              {% set parts = m.split("|") %}
              {% set flow = parts[0].split(">") %}
              {% set from = flow[0] %}
              {% set to = flow[1] %}
              {% set ns = namespace(fi=0, ti=0) %}
              {% for a in fields.get('actors') %}
                {% if a == from %}{% set ns.fi = loop.index0 %}{% endif %}
                {% if a == to %}{% set ns.ti = loop.index0 %}{% endif %}
              {% endfor %}
              {% set x1 = xs[ns.fi] %}
              {% set x2 = xs[ns.ti] %}
              {% set left = x1 if x1 < x2 else x2 %}
              {% set width = x2 - x1 if x2 > x1 else x1 - x2 %}
              {% set y = 18 + (loop.index0 * 60 / n) %}
            <div class="seq-msg{% if x1 > x2 %} dir-left{% endif %}" id="s-{{ scene_id }}-msg-{{ loop.index0 }}"
                 style="left: {{ left }}%; width: {{ width }}%; top: {{ y }}%">
              <div class="seq-msgline" id="s-{{ scene_id }}-msgline-{{ loop.index0 }}"></div>
              <span class="seq-msglabel" id="s-{{ scene_id }}-msglabel-{{ loop.index0 }}">{{ parts[1] }}</span>
            </div>
            {% endfor %}
          </div>
        </div>
        {% if fields.get('note') %}
        <div class="seq-note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>
        {% endif %}
      </div>
    </div>
  </div>
  <script>
    (function () {
      var SID = "s-{{ scene_id }}";
      var D = {{ duration }};
      var tl = gsap.timeline({ paused: true });

      AM.maskRise(tl, "#" + SID + "-kicker", 0.1 * D);
      AM.maskRise(tl, "#" + SID + "-headline", 0.25 * D);

      {% for a in fields.get('actors') %}
      AM.pop(tl, "#" + SID + "-actor-{{ loop.index0 }}", 0.35 * D + {{ loop.index0 }} * 0.1);
      {% endfor %}

      {% for a in fields.get('actors') %}
      tl.fromTo("#" + SID + "-life-{{ loop.index0 }}",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.55, ease: "power2.out" },
        0.45 * D + {{ loop.index0 }} * 0.06);
      {% endfor %}

      var msgBase = 0.55 * D;
      var msgStep = (0.30 * D) / {{ fields.get('messages')|length }};

      {% for m in fields.get('messages') %}
      tl.fromTo("#" + SID + "-msgline-{{ loop.index0 }}",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power2.out" },
        msgBase + {{ loop.index0 }} * msgStep);
      AM.stagger(tl, "#" + SID + "-msglabel-{{ loop.index0 }}", msgBase + {{ loop.index0 }} * msgStep + 0.12);
      {% endfor %}

      {% if fields.get('note') %}
      AM.maskRise(tl, "#" + SID + "-note", 0.88 * D);
      {% endif %}

      {% if not is_last %}
      AM.exitSoft(tl, "#" + SID + "-actors, #" + SID + "-msgs", D);
      {% endif %}

      tl.to({}, { duration: D }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["{{ scene_id }}"] = tl;
    })();
  </script>
</template></body></html>
