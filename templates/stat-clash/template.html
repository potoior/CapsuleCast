<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .duel {
          flex: 1; display: grid; grid-template-columns: 1fr 12cqw 1fr;
          align-items: center; min-height: 0; width: 92cqw;
        }
        #f-{{ scene_id }} .fighter {
          border: 1.5px solid var(--hairline-strong); border-radius: var(--tile-radius);
          padding: 3cqh 2cqw; display: flex; flex-direction: column; gap: 1cqh;
          align-items: center; min-width: 0;
        }
        #f-{{ scene_id }} .fighter.l { background: var(--tile); }
        #f-{{ scene_id }} .fighter.r {
          background: color-mix(in srgb, var(--coral) 10%, var(--cream)); border-color: var(--coral);
        }
        #f-{{ scene_id }} .fighter .fl { font-family: var(--font-mono); font-size: 2.2cqmin; letter-spacing: 0.1em; color: var(--ink-faint); }
        #f-{{ scene_id }} .fighter .fv {
          font-family: var(--font-display); font-size: 9cqmin; font-weight: 700; line-height: 1;
          color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
        }
        #f-{{ scene_id }} .fighter.r .fv { color: var(--coral-deep); }
        #f-{{ scene_id }} .vs {
          justify-self: center; align-self: center;
          width: 9cqw; height: 9cqw; border-radius: 50%;
          background: var(--ink); color: var(--cream);
          display: flex; align-items: center; justify-content: center;
          font-family: var(--font-mono); font-weight: 700; font-size: 2.8cqmin; letter-spacing: 0.08em;
        }
        #f-{{ scene_id }} .verdict {
          margin-top: 1.6cqh; width: 92cqw; padding: 1.5cqh 2cqw;
          border-radius: var(--tile-radius); background: var(--ink); color: var(--cream);
          font-size: 3cqmin; font-weight: 600; text-align: center;
        }
        #f-{{ scene_id }} .note { margin-top: 1cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; text-align: center; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .duel { grid-template-columns: 1fr; gap: 1cqh; }
          #f-{{ scene_id }} .vs { width: 10cqw; height: 5cqh; border-radius: 1cqw; }
          #f-{{ scene_id }} .fighter { flex-direction: row; justify-content: space-between; padding: 2cqh 4cqw; }
          #f-{{ scene_id }} .fighter .fv { font-size: 7cqmin; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="duel">
            <div class="fighter l" id="s-{{ scene_id }}-left">
              <span class="fl">{{ fields.left_label }}</span>
              <span class="fv" id="s-{{ scene_id }}-lv">{{ fields.left_value }}</span>
            </div>
            <div class="vs" id="s-{{ scene_id }}-vs">VS</div>
            <div class="fighter r" id="s-{{ scene_id }}-right">
              <span class="fl">{{ fields.right_label }}</span>
              <span class="fv" id="s-{{ scene_id }}-rv">{{ fields.right_value }}</span>
            </div>
          </div>
          <div class="verdict" id="s-{{ scene_id }}-verdict">{{ fields.verdict }}</div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.28);

          // 左右数字卡对撞进场，VS 徽章压轴弹出，裁决条收口
          var t0 = Math.min(0.9, D * 0.18);
          tl.fromTo("#" + SID + "-left", { opacity: 0, x: -48 * AD.flip },
            { opacity: 1, x: 0, duration: 0.6, ease: "back.out(1.7)" }, t0);
          tl.fromTo("#" + SID + "-right", { opacity: 0, x: 48 * AD.flip },
            { opacity: 1, x: 0, duration: 0.6, ease: "back.out(1.7)" }, t0 + 0.14);
          AM.pop(tl, "#" + SID + "-vs", t0 + 0.55, 0.5);
          AM.pulse(tl, "#" + SID + "-vs", t0 + 1.1);
          var tV = Math.min(t0 + 1.4, D * 0.64);
          AM.wipe(tl, "#" + SID + "-verdict", tV, 0.65, "bottom");
          AM.pulse(tl, "#" + SID + "-verdict", tV + 0.7);
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 },
              { opacity: 1, duration: 0.5 }, Math.min(tV + 0.5, D * 0.8));
          }

          {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-headline, #" + SID + "-left, #" + SID + "-vs, #" + SID + "-right, #" + SID + "-verdict", D);{% endif %}
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
