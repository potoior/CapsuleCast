<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
<body><template>
  <style>
    {{ base_css }}
    #f-{{ scene_id }} .wrap {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 2cqh 4cqw 0;
      box-sizing: border-box;
      text-align: center;
    }
    #f-{{ scene_id }} .kicker {
      font-family: var(--font-mono);
      font-size: 1.8cqmin;
      color: var(--coral-deep);
      letter-spacing: 0.18em;
    }
    #f-{{ scene_id }} .headline {
      margin-top: 1cqh;
      font-family: var(--font-display);
      font-size: 5.2cqmin;
      line-height: 1.15;
      color: var(--ink);
    }
    #f-{{ scene_id }} .bars {
      position: relative;
      width: 80cqw;
      height: 56cqh;
      margin: 2cqh auto 0;
    }
    #f-{{ scene_id }} .bar-zone {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 46cqh;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
    }
    #f-{{ scene_id }} .col {
      position: relative;
      width: 12cqw;
      height: 100%;
    }
    #f-{{ scene_id }} .seg {
      position: absolute;
      left: 0;
      right: 0;
      box-sizing: border-box;
      border-top: 0.35cqmin solid var(--cream);
      transform-origin: bottom center;
    }
    #f-{{ scene_id }} .seg-top {
      border-radius: 0.6cqmin 0.6cqmin 0 0;
    }
    #f-{{ scene_id }} .c-0 { background: var(--ink); }
    #f-{{ scene_id }} .c-1 { background: var(--coral); }
    #f-{{ scene_id }} .c-2 { background: color-mix(in srgb, var(--coral) 22%, var(--tile)); }
    #f-{{ scene_id }} .cap {
      position: absolute;
      left: -2cqw;
      right: -2cqw;
      font-family: var(--font-mono);
      font-size: 1.6cqmin;
      line-height: 1;
      color: var(--ink-faint);
      text-align: center;
    }
    #f-{{ scene_id }} .legend {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.4cqw;
      margin-top: 2.2cqh;
    }
    #f-{{ scene_id }} .lg-item {
      display: flex;
      align-items: center;
      gap: 0.8cqw;
    }
    #f-{{ scene_id }} .swatch {
      display: inline-block;
      width: 2cqw;
      height: 1.2cqh;
      border-radius: 0.2cqmin;
    }
    #f-{{ scene_id }} .lg-name {
      font-family: var(--font-mono);
      font-size: 1.6cqmin;
      color: var(--ink-soft);
    }
    #f-{{ scene_id }} .note {
      margin-top: 1.2cqh;
      font-family: var(--font-body);
      font-size: 1.6cqmin;
      color: var(--ink-faint);
    }
    {% for col in fields.get('columns', []) %}
    {% set i = loop.index0 %}
    {% set ns = namespace(acc=0) %}
    {% for val in col.split("|")[1].split(",") %}
    #f-{{ scene_id }} .seg-{{ i }}-{{ loop.index0 }} {
      bottom: {{ ns.acc }}%;
      height: {{ val|int }}%;
    }
    {% set ns.acc = ns.acc + val|int %}
    {% endfor %}
    #f-{{ scene_id }} .cap-{{ i }} {
      bottom: calc({{ ns.acc }}% + 1.2cqh);
    }
    {% endfor %}
    @container frame (max-aspect-ratio: 10/16) {
      #f-{{ scene_id }} .bars {
        width: 92cqw;
        height: 50cqh;
      }
      #f-{{ scene_id }} .bar-zone {
        height: 40cqh;
      }
      #f-{{ scene_id }} .col {
        width: 16cqw;
      }
    }
  </style>
  <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
       data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
    <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
    <div class="hf-safe">
      <div class="wrap">
        <div class="head">
          <div class="kicker" id="s-{{ scene_id }}-kicker">{{ fields.get('kicker', '') }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.get('headline', '') }}</div>
        </div>
        <div class="bars" id="s-{{ scene_id }}-bars">
          <div class="bar-zone">
            {% for col in fields.get('columns', []) %}
            {% set i = loop.index0 %}
            <div class="col col-{{ i }}" id="s-{{ scene_id }}-col-{{ i }}">
              {% for val in col.split("|")[1].split(",") %}
              <div class="seg seg-{{ i }}-{{ loop.index0 }} c-{{ loop.index0 }}{% if loop.last %} seg-top{% endif %}" id="s-{{ scene_id }}-seg-{{ i }}-{{ loop.index0 }}"></div>
              {% endfor %}
              <div class="cap cap-{{ i }}" id="s-{{ scene_id }}-cap-{{ i }}">{{ col.split("|")[0] }}</div>
            </div>
            {% endfor %}
          </div>
        </div>
        <div class="legend" id="s-{{ scene_id }}-legend">
          {% for item in fields.get('legend', []) %}
          <div class="lg-item" id="s-{{ scene_id }}-legend-{{ loop.index0 }}">
            <span class="swatch c-{{ loop.index0 }}" id="s-{{ scene_id }}-swatch-{{ loop.index0 }}"></span>
            <span class="lg-name" id="s-{{ scene_id }}-lgname-{{ loop.index0 }}">{{ item.split("|")[0] }}</span>
          </div>
          {% endfor %}
        </div>
        {% if fields.get('note') %}
        <div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>
        {% endif %}
      </div>
    </div>
  </div>
  <script>
    (function () {
      var SID = "s-{{ scene_id }}";
      var D = {{ duration }};
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#" + SID + "-kicker", { opacity: 0, yPercent: 30 }, { opacity: 1, yPercent: 0, duration: 0.45, ease: "power3.out" }, 0.1);
      tl.fromTo("#" + SID + "-headline", { opacity: 0, yPercent: 24 }, { opacity: 1, yPercent: 0, duration: 0.55, ease: "power3.out" }, 0.25);
      {% for col in fields.get('columns', []) %}
      tl.fromTo("#" + SID + "-cap-{{ loop.index0 }}", { opacity: 0, yPercent: 20 }, { opacity: 1, yPercent: 0, duration: 0.4, ease: "power2.out" }, {{ (0.35 + loop.index0 * 0.04)|round(2) }});
      {% set i = loop.index0 %}
      {% for val in col.split("|")[1].split(",") %}
      tl.fromTo("#" + SID + "-seg-{{ i }}-{{ loop.index0 }}", { scaleY: 0, opacity: 0.5 }, { scaleY: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, {{ (0.45 + i * 0.12 + loop.index0 * 0.06)|round(2) }});
      {% endfor %}
      {% endfor %}
      AM.stagger(tl, "#" + SID + "-legend", 0.52 * D);
      {% if fields.get('note') %}
      tl.fromTo("#" + SID + "-note", { opacity: 0, yPercent: 15 }, { opacity: 1, yPercent: 0, duration: 0.5, ease: "power2.out" }, 0.82 * D);
      {% endif %}
      {% if not is_last %}
      var exitSel = [];
      {% for col in fields.get('columns', []) %}
      exitSel.push("#" + SID + "-col-{{ loop.index0 }}");
      {% endfor %}
      AM.exitSoft(tl, exitSel.join(", "), D);
      {% endif %}
      tl.to({}, { duration: D }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["{{ scene_id }}"] = tl;
    })();
  </script>
</template></body></html>
