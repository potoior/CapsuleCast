<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
<body><template>
  <style>
    {{ base_css }}
    #f-{{ scene_id }} .chart-wrap {
      position: relative;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 4cqh 4cqw 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    #f-{{ scene_id }} .kicker {
      font-family: var(--font-mono);
      font-size: 2.1cqmin;
      line-height: 1.2;
      letter-spacing: 0.22em;
      color: var(--coral);
      text-transform: uppercase;
      margin-bottom: 1.2cqh;
      white-space: nowrap;
    }
    #f-{{ scene_id }} .headline {
      font-family: var(--font-display);
      font-size: 5.4cqmin;
      line-height: 1.08;
      color: var(--ink);
      text-align: center;
      margin-bottom: 3cqh;
      white-space: nowrap;
    }
    #f-{{ scene_id }} .bump-zone {
      position: relative;
      width: 86cqw;
      height: 58cqh;
    }
    #f-{{ scene_id }} .col-label {
      position: absolute;
      top: 0;
      width: 10cqw;
      margin-left: -5cqw;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 1.8cqmin;
      line-height: 1.2;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      white-space: nowrap;
    }
    #f-{{ scene_id }} .rank-row {
      position: absolute;
      left: 0;
      right: 0;
      height: 0;
      border-top: 1px dashed var(--hairline);
    }
    #f-{{ scene_id }} .rank-row.r1 { top: 12%; }
    #f-{{ scene_id }} .rank-row.r2 { top: 37%; }
    #f-{{ scene_id }} .rank-row.r3 { top: 62%; }
    #f-{{ scene_id }} .rank-row.r4 { top: 87%; }
    #f-{{ scene_id }} .bump-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    #f-{{ scene_id }} .bump-svg path {
      fill: none;
      stroke-width: 0.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #f-{{ scene_id }} .series-label {
      position: absolute;
      left: 88%;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 2.2cqmin;
      line-height: 1;
      white-space: nowrap;
    }
    #f-{{ scene_id }} .note {
      margin-top: 2cqh;
      font-family: var(--font-mono);
      font-size: 2cqmin;
      line-height: 1.3;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      text-align: center;
    }
    @container frame (max-aspect-ratio: 10/16) {
      #f-{{ scene_id }} .bump-zone {
        width: 92cqw;
      }
      #f-{{ scene_id }} .bump-svg path {
        stroke-width: 1;
      }
      #f-{{ scene_id }} .series-label {
        left: 84%;
      }
    }
  </style>
  <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
       data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
    <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
    <div class="hf-safe">
      <div class="chart-wrap" id="s-{{ scene_id }}-wrap">
        {% set cols = fields.get('columns') %}
        {% set series = fields.get('series') %}
        {% set ys = {'1': '8', '2': '33', '3': '58', '4': '83'} %}
        {% set xs = [8, 36, 64, 92] %}
        {% set palette = ['var(--coral)', 'var(--coral-deep)', 'var(--ink-soft)', 'var(--ink-faint)'] %}
        <div class="kicker" id="s-{{ scene_id }}-kicker">{{ fields.get('kicker') }}</div>
        <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.get('headline') }}</div>
        <div class="bump-zone" id="s-{{ scene_id }}-bump">
          {% for col in cols %}
          <div class="col-label" id="s-{{ scene_id }}-col-{{ loop.index0 }}" style="left: {{ xs[loop.index0] }}%;">{{ col }}</div>
          {% endfor %}
          <div class="rank-row r1" id="s-{{ scene_id }}-rank-1"></div>
          <div class="rank-row r2" id="s-{{ scene_id }}-rank-2"></div>
          <div class="rank-row r3" id="s-{{ scene_id }}-rank-3"></div>
          <div class="rank-row r4" id="s-{{ scene_id }}-rank-4"></div>
          <svg class="bump-svg" id="s-{{ scene_id }}-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            {% for raw in series %}
            {% set vals = raw.split("|")[1].split(",") %}
            <path id="s-{{ scene_id }}-line-{{ loop.index0 }}" d="M 8 {{ ys[vals[0]|trim] }} L 36 {{ ys[vals[1]|trim] }} L 64 {{ ys[vals[2]|trim] }} L 92 {{ ys[vals[3]|trim] }}" stroke="{{ palette[loop.index0] }}" />
            {% endfor %}
            {% for raw in series %}
            {% set vals = raw.split("|")[1].split(",") %}
            <circle id="s-{{ scene_id }}-dot-{{ loop.index0 }}" cx="92" cy="{{ ys[vals[3]|trim] }}" r="1.6" fill="{{ palette[loop.index0] }}" />
            {% endfor %}
          </svg>
          {% for raw in series %}
          {% set parts = raw.split("|") %}
          {% set vals = parts[1].split(",") %}
          <div class="series-label" id="s-{{ scene_id }}-label-{{ loop.index0 }}" style="top: calc({{ ys[vals[3]|trim] }}% - 2cqh); color: {{ palette[loop.index0] }};">{{ parts[0]|trim }}</div>
          {% endfor %}
        </div>
        {% if fields.get('note') %}
        <div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>
        {% endif %}
      </div>
    </div>
  </div>
  <script>
    (function () {
      var SID = "s-{{ scene_id }}";
      var D = {{ duration }};
      var tl = gsap.timeline({ paused: true });

      tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.1 * D);
      tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.25 * D);
      AM.stagger(tl, "#" + SID + "-col-0, #" + SID + "-col-1, #" + SID + "-col-2, #" + SID + "-col-3", 0.35 * D, 0.12);
      {% for i in range(series|length) %}
      AM.draw(tl, "#" + SID + "-line-{{ i }}", 0.5 * D + {{ i }} * 0.2);
      AM.pop(tl, "#" + SID + "-dot-{{ i }}", 0.5 * D + {{ i }} * 0.2 + 1.1);
      AM.slideX(tl, "#" + SID + "-label-{{ i }}", 0.5 * D + {{ i }} * 0.2 + 1.1, -1);
      {% endfor %}
      {% if fields.get('note') %}
      tl.fromTo("#" + SID + "-note", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.8 * D);
      {% endif %}
      {% if not is_last %}
      var exitSel = "{% for i in range(series|length) %}#s-{{ scene_id }}-line-{{ i }}, #s-{{ scene_id }}-label-{{ i }}{% if not loop.last %}, {% endif %}{% endfor %}";
      AM.exitSoft(tl, exitSel, D);
      {% endif %}
      tl.to({}, { duration: D }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["{{ scene_id }}"] = tl;
    })();
  </script>
</template></body></html>
