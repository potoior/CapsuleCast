<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; width: 92cqw; }
        #f-{{ scene_id }} .bp { width: 70cqw; background: #12233d; border: 1.5px solid #2e4a6e; border-radius: 1.2cqw; padding: 2.4cqh 2.4cqw; display: flex; flex-direction: column; gap: 1.6cqh; box-shadow: 0.8cqh 1cqw 0 color-mix(in srgb, var(--ink) 18%, transparent); position: relative; font-family: var(--font-mono); }
        #f-{{ scene_id }} .bp::before { content: "N ↑"; position: absolute; right: 2cqw; top: 1.6cqh; color: #7fa3cc; font-size: 2.2cqmin; font-weight: 700; }
        #f-{{ scene_id }} .b-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #2e4a6e; padding-bottom: 1cqh; }
        #f-{{ scene_id }} .b-ttl { font-family: var(--font-display); font-size: 3.4cqmin; font-weight: 900; color: #dbe9f8; letter-spacing: 0.08em; }
        #f-{{ scene_id }} .b-tot { font-size: 2.2cqmin; color: #7fa3cc; font-weight: 700; font-variant-numeric: tabular-nums; }
        #f-{{ scene_id }} .grid { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: minmax(6cqh, auto); gap: 1cqw; }
        #f-{{ scene_id }} .room { border: 1.5px solid #9fc0e8; border-radius: 0.6cqw; padding: 1cqh 0.8cqw; display: flex; flex-direction: column; gap: 0.3cqh; justify-content: center; align-items: center; text-align: center; min-width: 0; background: rgba(159, 192, 232, 0.06); }
        #f-{{ scene_id }} .room .rn { font-size: 2.6cqmin; font-weight: 700; color: #dbe9f8; white-space: nowrap; }
        #f-{{ scene_id }} .room .rm { font-size: 1.7cqmin; color: #7fa3cc; white-space: nowrap; }
        #f-{{ scene_id }} .room.hot { border-color: #ffb27f; }
        #f-{{ scene_id }} .room.hot .rn { color: #ffb27f; }
        #f-{{ scene_id }} .b-note { font-size: 1.9cqmin; color: #5f7fa5; }
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6cqmin; margin-top: 3cqh; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .bp { width: 92cqw; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="wrap"><div class="bp" id="s-{{ scene_id }}-bp"><div class="b-head"><span class="b-ttl" id="s-{{ scene_id }}-ttl">{{ fields.headline }}</span><span class="b-tot" id="s-{{ scene_id }}-tot">{{ fields.total_label }}</span></div><div class="grid" id="s-{{ scene_id }}-grid"></div><div class="b-note">比例仅为示意 · 实际以现场为准</div></div></div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.28);
          var RMS = {{ fields.get("rooms") | tojson }};
          var grid = document.getElementById(SID + "-grid");
          for (var i = 0; i < RMS.length; i++) {
            var p = String(RMS[i]).split("|");
            var w = Math.max(1, Math.min(3, parseInt(p[1], 10) || 1));
            var h = Math.max(1, Math.min(2, parseInt(p[2], 10) || 1));
            var r = document.createElement("div");
            r.className = "room" + (i === 0 ? " hot" : "");
            r.id = SID + "-room-" + i;
            r.style.gridColumn = "span " + w;
            r.style.gridRow = "span " + h;
            r.innerHTML = '<span class="rn">' + p[0] + '</span>' + (p[3] ? '<span class="rm">' + p[3] + '</span>' : '');
            grid.appendChild(r);
          }
          var t0 = Math.min(0.9, D * 0.16);
          tl.fromTo("#" + SID + "-bp", { opacity: 0, scale: 0.96 },
            { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, t0);
          tl.fromTo("#" + SID + "-ttl", { opacity: 0, y: -12 },
            { opacity: 1, y: 0, duration: 0.5 }, t0 + 0.2);
          tl.fromTo("#" + SID + "-tot", { opacity: 0 },
            { opacity: 1, duration: 0.4 }, t0 + 0.35);
          for (var i = 0; i < RMS.length; i++) {
            var at = t0 + 0.5 + 0.35 * i;
            tl.fromTo("#" + SID + "-room-" + i, { opacity: 0, scale: 0.7 },
              { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, at);
          }
          AM.pulse(tl, "#" + SID + "-room-0", Math.min(t0 + 0.5 + 0.35 * RMS.length + 0.4, D * 0.78));
          if (document.getElementById(SID + "-note")) {
            AM.wipe(tl, "#" + SID + "-note", Math.min(t0 + 1.0 + 0.35 * RMS.length, D * 0.85), 0.6, "bottom");
          }
          AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-headline, #" + SID + "-bp, [id^='" + SID + "-room-']", D);
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
