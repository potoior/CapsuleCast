<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
<body><template>
  <style>
    {{ base_css }}
    #f-{{ scene_id }} .bp-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1cqh;
      text-align: center;
    }
    #f-{{ scene_id }} .bp-kicker {
      font-family: var(--font-mono);
      font-size: 1.7cqmin;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--coral-deep);
    }
    #f-{{ scene_id }} .bp-headline {
      font-family: var(--font-display);
      font-size: 5.2cqmin;
      line-height: 1.15;
      color: var(--ink);
    }
    #f-{{ scene_id }} .bp {
      --stub-w: 14cqw;
      position: relative;
      display: flex;
      width: 74cqw;
      margin-top: 4.2cqh;
      background: var(--tile);
      border: 1px solid var(--hairline-strong);
      border-radius: var(--tile-radius);
      overflow: visible;
      transform-origin: 50% 100%;
    }
    #f-{{ scene_id }} .bp::before,
    #f-{{ scene_id }} .bp::after {
      content: "";
      position: absolute;
      right: calc(var(--stub-w) - 1.5cqw);
      width: 3cqw;
      height: 3cqw;
      border-radius: 50%;
      background: var(--cream);
      border: 1px solid var(--hairline-strong);
      z-index: 3;
    }
    #f-{{ scene_id }} .bp::before { top: calc(-1.5cqw - 1px); }
    #f-{{ scene_id }} .bp::after { bottom: calc(-1.5cqw - 1px); }
    #f-{{ scene_id }} .bp-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3cqh;
      padding: 3cqh 3cqw;
    }
    #f-{{ scene_id }} .bp-label {
      font-family: var(--font-mono);
      font-size: 1.5cqmin;
      letter-spacing: 0.2em;
      color: var(--ink-faint);
    }
    #f-{{ scene_id }} .bp-route {
      display: flex;
      align-items: center;
      gap: 2cqw;
    }
    #f-{{ scene_id }} .route-from,
    #f-{{ scene_id }} .route-to {
      display: flex;
      flex-direction: column;
      gap: 0.5cqh;
      flex: 0 0 auto;
    }
    #f-{{ scene_id }} .route-to { align-items: flex-end; text-align: right; }
    #f-{{ scene_id }} .rf-code {
      font-family: var(--font-display);
      font-size: 5.4cqmin;
      line-height: 1;
      letter-spacing: 0.02em;
      color: var(--ink);
    }
    #f-{{ scene_id }} .rf-name {
      font-family: var(--font-mono);
      font-size: 1.7cqmin;
      color: var(--ink-faint);
      white-space: nowrap;
    }
    #f-{{ scene_id }} .route-arrow {
      position: relative;
      flex: 1;
      min-width: 4cqw;
      border-top: 1px dashed var(--hairline-strong);
      color: var(--ink-soft);
    }
    #f-{{ scene_id }} .route-arrow::after {
      content: "✈";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -54%);
      padding: 0 1cqw;
      background: var(--tile);
      font-family: var(--font-mono);
      font-size: 2cqmin;
      line-height: 1;
    }
    #f-{{ scene_id }} .bp-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.6cqh 2cqw;
    }
    #f-{{ scene_id }} .cell {
      display: flex;
      flex-direction: column;
      gap: 0.45cqh;
      min-width: 0;
    }
    #f-{{ scene_id }} .c-label {
      font-family: var(--font-mono);
      font-size: 1.4cqmin;
      letter-spacing: 0.14em;
      color: var(--ink-faint);
    }
    #f-{{ scene_id }} .c-value {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 2.6cqmin;
      line-height: 1.2;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #f-{{ scene_id }} .bp-stub {
      width: var(--stub-w);
      flex: 0 0 var(--stub-w);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.4cqh;
      padding: 2.4cqh 1.4cqw;
      border-left: 2px dashed var(--hairline-strong);
      writing-mode: vertical-rl;
    }
    #f-{{ scene_id }} .stub-label {
      font-family: var(--font-mono);
      font-size: 1.4cqmin;
      letter-spacing: 0.2em;
      color: var(--ink-faint);
    }
    #f-{{ scene_id }} .stub-seat {
      font-family: var(--font-display);
      font-size: 4.6cqmin;
      line-height: 1;
      letter-spacing: 0.08em;
      color: var(--ink);
    }
    #f-{{ scene_id }} .bp-note {
      margin-top: 3cqh;
      font-family: var(--font-mono);
      font-size: 1.5cqmin;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      text-align: center;
    }
    @container frame (max-aspect-ratio: 10/16) {
      #f-{{ scene_id }} .bp { --stub-w: 12cqw; width: 92cqw; margin-top: 3.4cqh; }
      #f-{{ scene_id }} .bp-main { padding: 2.6cqh 2.4cqw; gap: 2.4cqh; }
      #f-{{ scene_id }} .bp-route { gap: 1.4cqw; }
      #f-{{ scene_id }} .rf-code { font-size: 4.4cqmin; }
      #f-{{ scene_id }} .rf-name { font-size: 1.5cqmin; }
      #f-{{ scene_id }} .c-value { font-size: 2.4cqmin; }
      #f-{{ scene_id }} .stub-seat { font-size: 3.8cqmin; }
    }
  </style>
  <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
       data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
    <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
    <div class="hf-safe">
      <div class="bp-head">
        <div class="bp-kicker" id="s-{{ scene_id }}-kicker">{{ fields.get('kicker') }}</div>
        <div class="bp-headline" id="s-{{ scene_id }}-headline">{{ fields.get('headline') }}</div>
      </div>
      {% set route = fields.get('route') %}
      {% set from_parts = route[0].split('|') %}
      {% set to_parts = route[1].split('|') %}
      {% set flight_parts = fields.get('flight').split('|') %}
      {% set gate_parts = fields.get('gate').split('|') %}
      {% set seat_parts = fields.get('seat').split('|') %}
      <div class="bp" id="s-{{ scene_id }}-bp">
        <div class="bp-main">
          <div class="bp-label">BOARDING PASS</div>
          <div class="bp-route">
            <div class="route-from" id="s-{{ scene_id }}-from">
              <div class="rf-code">{{ from_parts[1] }}</div>
              <div class="rf-name">{{ from_parts[0] }}</div>
            </div>
            <div class="route-arrow" id="s-{{ scene_id }}-arrow"></div>
            <div class="route-to" id="s-{{ scene_id }}-to">
              <div class="rf-code">{{ to_parts[1] }}</div>
              <div class="rf-name">{{ to_parts[0] }}</div>
            </div>
          </div>
          <div class="bp-grid">
            <div class="cell" id="s-{{ scene_id }}-cell-1">
              <div class="c-label">航班</div>
              <div class="c-value">{{ flight_parts[0] }}</div>
            </div>
            <div class="cell" id="s-{{ scene_id }}-cell-2">
              <div class="c-label">起飞</div>
              <div class="c-value">{{ flight_parts[1] }}</div>
            </div>
            <div class="cell" id="s-{{ scene_id }}-cell-3">
              <div class="c-label">{{ gate_parts[1] }}</div>
              <div class="c-value">{{ gate_parts[0] }}</div>
            </div>
            <div class="cell" id="s-{{ scene_id }}-cell-4">
              <div class="c-label">{{ seat_parts[1] }}</div>
              <div class="c-value">{{ seat_parts[0] }}</div>
            </div>
          </div>
        </div>
        <div class="bp-stub" id="s-{{ scene_id }}-stub">
          <div class="stub-label">座位</div>
          <div class="stub-seat">{{ seat_parts[0] }}</div>
        </div>
      </div>
      {% if fields.get('note') %}
      <div class="bp-note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>
      {% endif %}
    </div>
  </div>
  <script>
    (function () {
      var SID = "s-{{ scene_id }}";
      var D = {{ duration }};
      var tl = gsap.timeline({ paused: true });
      AM.pop(tl, "#" + SID + "-kicker", 0.1);
      AM.maskRise(tl, "#" + SID + "-headline", 0.25);
      AM.unfold(tl, "#" + SID + "-bp", 0.4);
      AM.slideX(tl, "#" + SID + "-from", 0.62, -1);
      AM.slideX(tl, "#" + SID + "-to", 0.62, 1);
      AM.stagger(tl, "#" + SID + "-cell-1, #" + SID + "-cell-2, #" + SID + "-cell-3, #" + SID + "-cell-4", 0.75, 0.1);
      AM.wipe(tl, "#" + SID + "-stub", 0.9, "right");
      {% if fields.get('note') %}
      AM.focus(tl, "#" + SID + "-note", 0.9 * D);
      {% endif %}
      {% if not is_last %}
      AM.exitSoft(tl, "#" + SID + "-bp, #" + SID + "-kicker, #" + SID + "-headline, #" + SID + "-note", D);
      {% endif %}
      tl.to({}, { duration: D }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["{{ scene_id }}"] = tl;
    })();
  </script>
</template></body></html>
