<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
<body><template>
  <style>
    {{ base_css }}
    #f-{{ scene_id }} .page {
      position: absolute;
      inset: 0;
      padding: 7cqh 6cqw 0 6cqw;
      box-sizing: border-box;
      text-align: left;
    }
    #f-{{ scene_id }} .kicker {
      font-family: var(--font-mono);
      font-size: 1.9cqmin;
      letter-spacing: 0.12em;
      color: var(--ink-faint);
      text-transform: uppercase;
      margin: 0 0 1.4cqh 0;
    }
    #f-{{ scene_id }} .headline {
      font-family: var(--font-display);
      font-size: 5.2cqmin;
      line-height: 1.12;
      color: var(--ink);
      margin: 0;
      max-width: 78cqw;
    }
    #f-{{ scene_id }} .slip {
      position: absolute;
      left: 0;
      right: 0;
      top: 9cqh;
      bottom: 2cqh;
      margin: auto;
      width: 62cqw;
      height: fit-content;
      box-sizing: border-box;
      padding: 3cqh 3.4cqw;
      background: var(--tile);
      border: 1px solid var(--hairline-strong);
      border-top: 2px solid var(--ink);
      border-radius: var(--tile-radius);
    }
    #f-{{ scene_id }} .slip-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-top: 1px solid var(--hairline-strong);
      padding-top: 1.3cqh;
      margin-bottom: 2cqh;
      font-family: var(--font-mono);
      font-size: 1.8cqmin;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
    }
    #f-{{ scene_id }} .slip-row {
      display: flex;
      align-items: center;
      height: 4.6cqh;
      min-width: 0;
    }
    #f-{{ scene_id }} .sr-name {
      font-family: var(--font-body);
      font-size: 2.4cqmin;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      max-width: 48%;
    }
    #f-{{ scene_id }} .sr-dots {
      flex: 1;
      height: 1px;
      border-bottom: 1px dashed var(--hairline);
      margin: 0 1cqw;
      transform-origin: left center;
    }
    #f-{{ scene_id }} .sr-amount {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 2.4cqmin;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      white-space: nowrap;
      text-align: right;
    }
    #f-{{ scene_id }} .sr-amount.neg {
      color: var(--coral-deep);
    }
    #f-{{ scene_id }} .slip-total {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-top: 2px solid var(--ink);
      margin-top: 1.6cqh;
      padding-top: 1.6cqh;
    }
    #f-{{ scene_id }} .st-name {
      font-family: var(--font-display);
      font-size: 3cqmin;
      color: var(--ink);
    }
    #f-{{ scene_id }} .st-amount {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 4.2cqmin;
      font-variant-numeric: tabular-nums;
      color: var(--coral-deep);
      white-space: nowrap;
    }
    #f-{{ scene_id }} .slip-note {
      margin-top: 2cqh;
      font-family: var(--font-body);
      font-size: 2cqmin;
      color: var(--ink-faint);
    }
    @container frame (max-aspect-ratio: 10/16) {
      #f-{{ scene_id }} .page {
        padding: 9cqh 6cqw 0 6cqw;
      }
      #f-{{ scene_id }} .headline {
        font-size: 5.6cqmin;
        max-width: 86cqw;
      }
      #f-{{ scene_id }} .slip {
        top: 12cqh;
        width: 88cqw;
        padding: 2.6cqh 3cqw;
      }
      #f-{{ scene_id }} .slip-head {
        font-size: 1.62cqmin;
      }
      #f-{{ scene_id }} .sr-name,
      #f-{{ scene_id }} .sr-amount {
        font-size: 2.16cqmin;
      }
      #f-{{ scene_id }} .st-name {
        font-size: 2.7cqmin;
      }
      #f-{{ scene_id }} .st-amount {
        font-size: 3.78cqmin;
      }
      #f-{{ scene_id }} .slip-note {
        font-size: 1.8cqmin;
      }
    }
  </style>
  <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
       data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
    <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
    <div class="hf-safe">
      <div class="page">
        <p class="kicker" id="s-{{ scene_id }}-kicker">{{ fields.get('kicker') }}</p>
        <h2 class="headline" id="s-{{ scene_id }}-headline">{{ fields.get('headline') }}</h2>
        <div class="slip" id="s-{{ scene_id }}-slip">
          <div class="slip-head">
            <span>工资明细</span>
            <span>2026.10</span>
          </div>
          {% for it in fields.get('items') %}
          {% set i = loop.index0 %}
          {% set parts = it.split('|') %}
          <div class="slip-row" id="s-{{ scene_id }}-row-{{ i }}">
            <span class="sr-name">{{ parts[0] }}</span>
            <span class="sr-dots" id="s-{{ scene_id }}-dots-{{ i }}"></span>
            <span class="sr-amount{% if parts[1].strip().startswith('-') %} neg{% endif %}">{{ parts[1] }}</span>
          </div>
          {% endfor %}
          <div class="slip-total" id="s-{{ scene_id }}-total">
            <span class="st-name">{{ fields.get('total').split('|')[0] }}</span>
            <span class="st-amount">{{ fields.get('total').split('|')[1] }}</span>
          </div>
          {% if fields.get('note') %}
          <div class="slip-note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var SID = "s-{{ scene_id }}";
      var D = {{ duration }};
      var N = {{ fields.get('items')|length }};
      var tl = gsap.timeline({ paused: true });

      AM.maskRise(tl, "#" + SID + "-kicker", 0.1);
      AM.maskRise(tl, "#" + SID + "-headline", 0.25);

      tl.fromTo("#" + SID + "-slip",
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" }, 0.4);

      {% for it in fields.get('items') %}
      {% set i = loop.index0 %}
      AM.stagger(tl, "#" + SID + "-row-{{ i }}", {{ 0.55 + 0.14 * i }});
      AM.growX(tl, "#" + SID + "-dots-{{ i }}", {{ 0.55 + 0.14 * i }});
      {% endfor %}

      {% set total_at = 0.55 + 0.14 * (fields.get('items')|length) + 0.25 %}
      AM.focus(tl, "#" + SID + "-total", {{ total_at }});

      {% if fields.get('note') %}
      tl.fromTo("#" + SID + "-note",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power1.out" }, {{ 0.85 * duration }});
      {% endif %}

      {% if not is_last %}
      AM.exitSoft(tl, "#" + SID + "-slip", D);
      {% endif %}

      tl.to({}, { duration: D }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["{{ scene_id }}"] = tl;
    })();
  </script>
</template></body></html>
