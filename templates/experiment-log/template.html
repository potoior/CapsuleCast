<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6.2cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .log {
          flex: 1; position: relative; display: flex; flex-direction: column;
          justify-content: center; gap: 1.6cqh; min-height: 0; width: 92cqw;
        }
        #f-{{ scene_id }} .spine {
          position: absolute; left: 3.2cqw; top: 10%; bottom: 10%; width: 1.5px;
          background: var(--hairline-strong); transform-origin: 50% 0%;
        }
        #f-{{ scene_id }} .entry {
          display: grid; grid-template-columns: 6.4cqw 1fr; gap: 1.8cqw; align-items: center;
          position: relative;
        }
        #f-{{ scene_id }} .entry .chip {
          width: 6.4cqw; height: 6.4cqw; border-radius: 50%;
          background: var(--cream); border: 1.5px solid var(--ink);
          display: flex; align-items: center; justify-content: center;
          font-family: var(--font-mono); font-size: 2.2cqmin; font-weight: 700; color: var(--ink);
        }
        #f-{{ scene_id }} .entry .card {
          border: 1px solid var(--hairline-strong); border-radius: var(--tile-radius);
          background: var(--cream); padding: 1.6cqh 1.6cqw; min-width: 0;
        }
        #f-{{ scene_id }} .entry .card .tag {
          font-family: var(--font-mono); font-size: 1.8cqmin; letter-spacing: 0.16em;
          color: var(--ink-faint); margin-bottom: 0.3cqh;
        }
        #f-{{ scene_id }} .entry .card b { font-size: 3cqmin; font-weight: 600; color: var(--ink); line-height: 1.35; }
        #f-{{ scene_id }} .entry.twist .chip { background: var(--coral); border-color: var(--coral); color: var(--cream); }
        #f-{{ scene_id }} .entry.twist .card { border-color: var(--coral); background: color-mix(in srgb, var(--coral) 10%, var(--cream)); }
        #f-{{ scene_id }} .entry.twist .card b { color: var(--coral-deep); }
        #f-{{ scene_id }} .note { margin-top: 1.2cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; text-align: center; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .spine { left: 3cqw; }
          #f-{{ scene_id }} .entry { grid-template-columns: 10cqw 1fr; }
          #f-{{ scene_id }} .entry .chip { width: 9cqw; height: 9cqw; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="log">
            <div class="spine" id="s-{{ scene_id }}-spine"></div>
            <div class="entry" id="s-{{ scene_id }}-e0">
              <div class="chip">01</div>
              <div class="card"><div class="tag">猜想</div><b>{{ fields.hypothesis }}</b></div>
            </div>
            <div class="entry" id="s-{{ scene_id }}-e1">
              <div class="chip">02</div>
              <div class="card"><div class="tag">操作</div><b>{{ fields.method }}</b></div>
            </div>
            <div class="entry" id="s-{{ scene_id }}-e2">
              <div class="chip">03</div>
              <div class="card"><div class="tag">结果</div><b>{{ fields.result }}</b></div>
            </div>
            <div class="entry twist" id="s-{{ scene_id }}-e3">
              <div class="chip">!</div>
              <div class="card"><div class="tag">反常识</div><b>{{ fields.twist }}</b></div>
            </div>
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.28);

          // 日志线自上而下生长 → 三段流水账 → 反常识卡红色压轴
          var t0 = Math.min(0.9, D * 0.16);
          tl.fromTo("#" + SID + "-spine", { scaleY: 0 },
            { scaleY: 1, duration: 0.9, ease: "power2.inOut" }, t0);
          var span = Math.max(0.7, D * 0.38);
          for (var i = 0; i < 4; i++) {
            var at = t0 + 0.25 + (span * i) / 4;
            tl.fromTo("#" + SID + "-e" + i, { opacity: 0, x: 26 * AD.flip },
              { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at);
            AM.pop(tl, "#" + SID + "-e" + i + " .chip", at + 0.1, 0.35);
          }
          var tT = t0 + 0.25 + span + 0.3;
          AM.pulse(tl, "#" + SID + "-e3", tT);
          if (document.getElementById(SID + "-note")) {
            AM.wipe(tl, "#" + SID + "-note", Math.min(tT + 0.7, D * 0.8), 0.6, "bottom");
          }

          {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-headline, #" + SID + "-spine, [id^='" + SID + "-e']", D);{% endif %}
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
