<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6.2cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .radar-zone { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
        #f-{{ scene_id }} svg.radar { width: 100%; height: 100%; }
        #f-{{ scene_id }} .r-grid { fill: none; stroke: var(--hairline); stroke-width: 1.6; }
        #f-{{ scene_id }} .r-axis { stroke: var(--hairline-strong); stroke-width: 2; }
        #f-{{ scene_id }} .r-poly { fill: color-mix(in srgb, var(--coral) 22%, transparent); stroke: var(--coral); stroke-width: 4; stroke-linejoin: round; }
        #f-{{ scene_id }} .r-dot { fill: var(--coral); }
        #f-{{ scene_id }} .r-lab { font-family: var(--font-body); font-weight: 700; font-size: 3.4cqmin; fill: var(--ink); text-anchor: middle; }
        #f-{{ scene_id }} .r-val { font-family: var(--font-mono); font-weight: 700; font-size: 2.6cqmin; fill: var(--coral-deep); text-anchor: middle; }
        #f-{{ scene_id }} .note { margin-top: 1.2cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="radar-zone">
            <svg class="radar" id="s-{{ scene_id }}-svg" viewBox="0 0 1600 740" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}", D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var NS = "http://www.w3.org/2000/svg";
          var svg = document.getElementById(SID + "-svg");
          var CX = 800, CY = 400, R = 250;
          var axes = [];
          {% for raw in fields.axes -%}
          {%- set p = raw.split("|") -%}
          axes.push({ lab: {{ p[0] | tojson }}, val: parseFloat({{ (p[1] if p|length > 1 else "50") | tojson }}) || 50 });
          {% endfor -%}
          var N = axes.length;
          function pt(i, r) {
            var a = (-90 + i * 360 / N) * Math.PI / 180;
            return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
          }
          function el(tag, attrs, text) {
            var e = document.createElementNS(NS, tag);
            for (var k in attrs) { e.setAttribute(k, attrs[k]); }
            if (text != null) { e.textContent = text; }
            svg.appendChild(e); return e;
          }
          // 网格环 + 轴
          for (var g = 1; g <= 3; g++) {
            var ring = "";
            for (var i = 0; i < N; i++) {
              var p = pt(i, R * g / 3);
              ring += (i ? " L " : "M ") + p[0] + " " + p[1];
            }
            var rp = el("path", { class: "r-grid", d: ring + " Z", id: SID + "-g" + g, opacity: 0 });
          }
          for (var j = 0; j < N; j++) {
            var ap = pt(j, R);
            var ax = el("line", { class: "r-axis", x1: CX, y1: CY, x2: ap[0], y2: ap[1], id: SID + "-ax" + j, opacity: 0 });
          }
          // 数值多边形
          var poly = "";
          for (var k = 0; k < N; k++) {
            var vp = pt(k, R * Math.min(100, Math.max(0, axes[k].val)) / 100);
            poly += (k ? " L " : "M ") + vp[0] + " " + vp[1];
          }
          var polyEl = el("path", { class: "r-poly", d: poly + " Z", id: SID + "-poly" });
          polyEl.style.transformOrigin = CX + "px " + CY + "px";
          var dots = [], labs = [];
          for (var m = 0; m < N; m++) {
            var dp = pt(m, R * Math.min(100, Math.max(0, axes[m].val)) / 100);
            var dot = el("circle", { class: "r-dot", cx: dp[0], cy: dp[1], r: 8, id: SID + "-d" + m, opacity: 0 });
            dots.push(dot);
            var lp = pt(m, R + 92);
            var sy = Math.sin((-90 + m * 360 / N) * Math.PI / 180);
            if (sy < -0.35) { lp[1] = dp[1] + 96; }
            else if (sy > 0.35) { lp[1] = dp[1] - 120; }
            var lt = el("text", { class: "r-lab", x: lp[0], y: lp[1], id: SID + "-t" + m, opacity: 0 }, axes[m].lab);
            labs.push(lt);
            var vt = el("text", { class: "r-val", x: lp[0], y: lp[1] + 40, id: SID + "-v" + m, opacity: 0 },
              String(Math.round(axes[m].val)));
          }
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.26);
          for (var g2 = 1; g2 <= 3; g2++) {
            tl.to("#" + SID + "-g" + g2, { opacity: 1, duration: 0.3 }, D * 0.22 + g2 * 0.07);
          }
          for (var a2 = 0; a2 < N; a2++) {
            tl.to("#" + SID + "-ax" + a2, { opacity: 1, duration: 0.25 }, D * 0.24 + a2 * 0.05);
          }
          tl.fromTo(polyEl, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: D * 0.18, ease: "back.out(1.4)" }, D * 0.34);
          for (var d2 = 0; d2 < N; d2++) {
            var at = D * 0.36 + D * 0.24 * (d2 / Math.max(1, N - 1));
            tl.fromTo(dots[d2], { attr: { r: 0 }, opacity: 0 }, { attr: { r: 8 }, opacity: 1, duration: 0.3, ease: "back.out(2)" }, at);
            tl.fromTo(labs[d2], { opacity: 0 }, { opacity: 1, duration: 0.3 }, at + 0.05);
            tl.fromTo("#" + SID + "-v" + d2, { opacity: 0 }, { opacity: 1, duration: 0.3 }, at + 0.12);
          }
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 }, { opacity: 1, duration: 0.6 }, D * 0.72);
          }
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
