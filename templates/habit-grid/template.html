<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6.2cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .duo {
          flex: 1; display: grid; grid-template-columns: 52cqw 1fr;
          align-items: center; gap: 2.4cqw; min-height: 0; width: 92cqw;
        }
        #f-{{ scene_id }} .grid {
          display: grid; grid-template-columns: repeat(7, 1fr);
          gap: 0.9cqw; width: 52cqw;
        }
        #f-{{ scene_id }} .cell {
          aspect-ratio: 1; border-radius: 0.7cqw;
          background: var(--tile); border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
        }
        #f-{{ scene_id }} .cell.on { background: color-mix(in srgb, var(--ink) 72%, var(--cream)); border-color: transparent; }
        #f-{{ scene_id }} .cell.hot { background: var(--coral); border-color: transparent; }
        #f-{{ scene_id }} .stats { display: flex; flex-direction: column; gap: 1.8cqh; }
        #f-{{ scene_id }} .stat { display: flex; flex-direction: column; gap: 0.2cqh; }
        #f-{{ scene_id }} .stat .n {
          font-family: var(--font-display); font-size: 5.8cqmin; font-weight: 700;
          color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1;
        }
        #f-{{ scene_id }} .stat.hot .n { color: var(--coral-deep); }
        #f-{{ scene_id }} .stat .l { font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.1em; }
        #f-{{ scene_id }} .verdict {
          margin-top: 1.6cqh; width: 92cqw; padding: 1.4cqh 2cqw;
          border-radius: var(--tile-radius); background: var(--ink); color: var(--cream);
          font-size: 2.9cqmin; font-weight: 600; text-align: center;
        }
        #f-{{ scene_id }} .note { margin-top: 1cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; text-align: center; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .duo { grid-template-columns: 1fr; width: 92cqw; }
          #f-{{ scene_id }} .grid { width: 74cqw; margin: 0 auto; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="duo">
            <div class="grid" id="s-{{ scene_id }}-grid"></div>
            <div class="stats">
              <div class="stat" id="s-{{ scene_id }}-s-done">
                <span class="n" id="s-{{ scene_id }}-n-done">0</span>
                <span class="l">完成 / 总数</span>
              </div>
              <div class="stat hot" id="s-{{ scene_id }}-s-streak">
                <span class="n" id="s-{{ scene_id }}-n-streak">0</span>
                <span class="l">连续{{ fields.unit }}</span>
              </div>
            </div>
          </div>
          <div class="verdict" id="s-{{ scene_id }}-verdict">{{ fields.verdict }}</div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          var grid = document.getElementById(SID + "-grid");

          var done = parseInt("{{ fields.done }}", 10) || 0;
          var total = Math.min(35, parseInt("{{ fields.total }}", 10) || 35);
          var streak = Math.min(done, parseInt("{{ fields.streak }}", 10) || 0);
          // 确定性点亮：done 个格子按质数步长散布，最后 streak 个连成尾段
          var step = 3, fill = [];
          for (var i = 0; i < total; i++) fill.push(false);
          var idx = 0;
          for (var k = 0; k < done - streak; k++) {
            fill[idx % total] = true;
            idx += step;
          }
          for (var k = 0; k < streak; k++) fill[(total - 1 - k + total) % total] = true;
          for (var i = 0; i < total; i++) {
            var c = document.createElement("div");
            c.className = "cell" + (fill[i] ? (i >= total - streak ? " on hot" : " on") : "");
            c.id = SID + "-cell-" + i;
            grid.appendChild(c);
          }

          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.28);

          // 方格波纹点亮 + 数字滚动 + 战绩条收口
          var t0 = Math.min(0.9, D * 0.16);
          var span = Math.max(0.6, D * 0.42);
          for (var i = 0; i < total; i++) {
            tl.fromTo("#" + SID + "-cell-" + i, { opacity: 0, scale: 0.4 },
              { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" },
              t0 + (span * i) / total);
          }
          AM.countUp(tl, "#" + SID + "-n-done", 0, done, t0 + 0.3, Math.min(1.2, D * 0.3), " / " + total);
          AM.countUp(tl, "#" + SID + "-n-streak", 0, streak, t0 + 0.6, Math.min(1.2, D * 0.3), " {{ fields.unit }}");
          AM.pulse(tl, "#" + SID + "-s-streak", t0 + span + 0.2);
          var tV = Math.min(t0 + span + 0.5, D * 0.7);
          AM.wipe(tl, "#" + SID + "-verdict", tV, 0.65, "bottom");
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 },
              { opacity: 1, duration: 0.5 }, Math.min(tV + 0.5, D * 0.82));
          }

          {% if not is_last %}AM.exitSoft(tl, "#" + SID + "-kicker, #" + SID + "-headline, [id^='" + SID + "-cell-'], #" + SID + "-s-done, #" + SID + "-s-streak, #" + SID + "-verdict", D);{% endif %}
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
