<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline { font-family: var(--font-display); font-size: 6.2cqmin; margin-top: 3cqh; }
        #f-{{ scene_id }} .stack { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2.6cqh; min-height: 0; width: 84cqw; }
        #f-{{ scene_id }} .card {
          position: relative;
          border: 1px solid var(--hairline-strong);
          border-radius: var(--tile-radius);
          padding: 2.6cqh 2.4cqw 2.6cqh 7cqw;
          background: var(--cream);
        }
        #f-{{ scene_id }} .card .mark {
          position: absolute; left: 2cqw; top: 50%; transform: translateY(-50%);
          width: 4.2cqmin; height: 4.2cqmin; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-size: 2.6cqmin; font-weight: 700;
          font-family: var(--font-body);
        }
        #f-{{ scene_id }} .card .txt { font-family: var(--font-body); font-size: 3.4cqmin; line-height: 1.35; color: var(--ink); }
        #f-{{ scene_id }} .card.myth .mark { background: var(--ink); color: var(--cream); }
        #f-{{ scene_id }} .card.myth .txt { color: var(--ink-soft); }
        #f-{{ scene_id }} .strike {
          position: absolute; left: 7cqw; right: 2.4cqw; top: 50%; height: 3px;
          background: var(--coral); transform: scaleX(0); transform-origin: left center;
          border-radius: 2px;
        }
        #f-{{ scene_id }} .card.truth { border-color: var(--coral); background: color-mix(in srgb, var(--coral) 9%, var(--cream)); }
        #f-{{ scene_id }} .card.truth .mark { background: var(--coral); color: var(--cream); }
        #f-{{ scene_id }} .note { margin-top: 1.2cqh; font-family: var(--font-mono); font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em; }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} .stack { width: 92cqw; }
          #f-{{ scene_id }} .card .txt { font-size: 4cqmin; }
        }
      </style>
      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker"><span class="hf-spike"></span> {{ fields.kicker }}</div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="stack">
            <div class="card myth" id="s-{{ scene_id }}-myth">
              <span class="mark">✗</span>
              <span class="txt">{{ fields.myth }}</span>
              <span class="strike" id="s-{{ scene_id }}-strike"></span>
            </div>
            <div class="card truth" id="s-{{ scene_id }}-truth">
              <span class="mark">✓</span>
              <span class="txt">{{ fields.truth }}</span>
            </div>
          </div>
          {% if fields.get('note') %}<div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>{% endif %}
        </div>
      </div>
      <script>
        (function () {
          var SID = "s-{{ scene_id }}", D = {{ duration }};
          var AD = window.__AD || { flip: 1, pace: 1 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.26);
          // 误区先立
          tl.fromTo("#" + SID + "-myth", { opacity: 0, x: -30 * AD.flip }, { opacity: 1, x: 0, duration: 0.5 * AD.pace, ease: "power3.out" }, D * 0.26);
          // 划掉
          tl.to("#" + SID + "-strike", { scaleX: 1, duration: 0.4, ease: "power2.in" }, D * 0.46);
          // 真相接管
          tl.fromTo("#" + SID + "-truth", { opacity: 0, y: 34 * AD.flip, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.55 * AD.pace, ease: "back.out(1.4)" }, D * 0.56);
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 }, { opacity: 1, duration: 0.6 }, D * 0.72);
          }
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
