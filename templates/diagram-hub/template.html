<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>{{ scene_id }}</title>
  </head>
  <body>
    <template>
      <style>
        {{ base_css }}
        #f-{{ scene_id }} .headline {
          font-family: var(--font-display);
          font-size: 6.2cqmin;
          margin-top: 3cqh;
        }
        #f-{{ scene_id }} .hub-wrap {
          flex: 1; margin-top: 2cqh;
          display: flex; align-items: center; justify-content: center;
          min-height: 0;
        }
        #f-{{ scene_id }} svg.hub { width: 92cqw; height: auto; max-height: 58cqh; display: block; }
        #f-{{ scene_id }} .h-line {
          stroke: color-mix(in srgb, var(--ink) 30%, transparent);
          stroke-width: 3; stroke-dasharray: 7 7;
        }
        #f-{{ scene_id }} .h-node { fill: var(--tile-strong); stroke: var(--ink); stroke-width: 2.6; }
        #f-{{ scene_id }} .h-node.hot { fill: var(--coral); stroke: var(--coral-deep); }
        #f-{{ scene_id }} .h-core {
          fill: var(--ink); stroke: none;
        }
        #f-{{ scene_id }} .h-core-text {
          font-family: var(--font-body); font-size: 34px; font-weight: 700;
          fill: var(--cream); text-anchor: middle; dominant-baseline: middle;
        }
        #f-{{ scene_id }} .h-label {
          font-family: var(--font-body); font-size: 29px; font-weight: 700;
          fill: var(--ink); text-anchor: middle; dominant-baseline: middle;
        }
        #f-{{ scene_id }} .h-sub {
          font-family: var(--font-mono); font-size: 21px;
          fill: var(--ink-faint); text-anchor: middle; dominant-baseline: middle;
        }
        #f-{{ scene_id }} .note {
          margin-top: 1.4cqh; font-family: var(--font-mono);
          font-size: 2cqmin; color: var(--ink-faint); letter-spacing: 0.06em;
        }
        @container frame (max-aspect-ratio: 10/16) {
          #f-{{ scene_id }} svg.hub { width: 96cqw; max-height: 48cqh; }
        }
      </style>

      <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
        data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
        <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>

        <div class="hf-safe">
          <div class="hf-kicker" id="s-{{ scene_id }}-kicker">
            <span class="hf-spike"></span> {{ fields.kicker }}
          </div>
          <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.headline }}</div>
          <div class="hub-wrap">
            <svg class="hub" viewBox="0 0 1600 780" id="s-{{ scene_id }}-svg"></svg>
          </div>
          {% if fields.get('note') %}
          <div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>
          {% endif %}
        </div>
      </div>

      <script>
        (function () {
          var SID = "s-{{ scene_id }}";
          var D = {{ duration }};
          var SPOKES = {{ fields.spokes | tojson }};
          var CENTER = "{{ fields.center }}";
          var WS = {{ (fields.get('weights') or []) | tojson }};
          function wOf(i) {
            var w = WS[i];
            return (typeof w === "number" && w >= 1 && w <= 5) ? w : 0;
          }
          var N = SPOKES.length;
          var svg = document.getElementById(SID + "-svg");
          var NS = "http://www.w3.org/2000/svg";
          var CX = 800, CY = 400, R = 300;

          function el(tag, attrs, text) {
            var e = document.createElementNS(NS, tag);
            for (var k in attrs) e.setAttribute(k, attrs[k]);
            if (text != null) e.textContent = text;
            svg.appendChild(e);
            return e;
          }
          function pt(deg, r) {
            var rad = deg * Math.PI / 180;
            return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
          }

          var gap = 360 / N;
          // 连线先建（画在节点下面）
          var lineEls = [];
          for (var i = 0; i < N; i++) {
            var ang = -90 + i * gap;
            var outer = pt(ang, R);
            var ln = el("line", {
              class: "h-line", id: SID + "-l-" + i, opacity: 0,
              x1: CX, y1: CY, x2: outer[0], y2: outer[1],
            });
            ln.style.strokeWidth = wOf(i) ? 2 + wOf(i) : 3;
            lineEls.push(ln);
          }
          // 中心
          el("circle", { class: "h-core", cx: CX, cy: CY, r: 88, id: SID + "-core", opacity: 0 });
          el("text", { class: "h-core-text", x: CX, y: CY, id: SID + "-core-t", opacity: 0 }, CENTER);
          // 辐射节点 + 标签（扇区自适应：顶节点标签在下、底节点在上、侧节点径向外）
          for (var i = 0; i < N; i++) {
            var parts = String(SPOKES[i]).split("|");
            var ang = -90 + i * gap;
            var p = pt(ang, R);
            var isHot = i === 0;
            var wgt = wOf(i);
            var nr = wgt ? 30 + 6 * wgt : 42;
            el("circle", { class: "h-node" + (isHot ? " hot" : ""),
              cx: p[0], cy: p[1], r: nr, id: SID + "-n-" + i, opacity: 0 });
            var rad = ang * Math.PI / 180;
            var sv = Math.sin(rad), cv = Math.cos(rad);
            var nx, ny, sx, sy;
            if (sv < -0.35) {          // 顶部节点 → 标签放节点下方
              nx = p[0]; ny = p[1] + 88; sx = p[0]; sy = p[1] + 126;
            } else if (sv > 0.35) {    // 底部节点 → 标签放节点上方
              nx = p[0]; ny = p[1] - 128; sx = p[0]; sy = p[1] - 90;
            } else {                   // 侧节点 → 径向外移
              var lx = pt(ang, R + 128);
              nx = lx[0]; ny = lx[1] - 12; sx = lx[0]; sy = lx[1] + 26;
            }
            el("text", { class: "h-label", x: nx, y: ny,
              id: SID + "-t-" + i, opacity: 0 }, parts[0]);
            if (parts.length > 1 && parts[1]) {
              el("text", { class: "h-sub", x: sx, y: sy,
                id: SID + "-s-" + i, opacity: 0 }, parts[1]);
            }
          }

          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.26);
          tl.fromTo("#" + SID + "-core", { opacity: 0, scale: 0.3, transformOrigin: "center" },
            { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 0.5);
          tl.fromTo("#" + SID + "-core-t", { opacity: 0 },
            { opacity: 1, duration: 0.4 }, 0.8);

          // 辐射展开：连线 → 节点 → 标签
          var start = D * 0.22, span = D * 0.46;
          for (var i = 0; i < N; i++) {
            var at = start + (span * i) / N;
            tl.fromTo("#" + SID + "-l-" + i, { opacity: 0 },
              { opacity: 1, duration: 0.3 }, at);
            tl.fromTo("#" + SID + "-n-" + i,
              { opacity: 0, scale: 0.3, transformOrigin: "center" },
              { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2)" }, at + 0.16);
            tl.fromTo("#" + SID + "-t-" + i, { opacity: 0, y: 8 },
              { opacity: 1, y: 0, duration: 0.3 }, at + 0.28);
            var subEl = document.getElementById(SID + "-s-" + i);
            if (subEl) tl.fromTo(subEl, { opacity: 0 }, { opacity: 1, duration: 0.3 }, at + 0.36);
          }
          if (document.getElementById(SID + "-note")) {
            tl.fromTo("#" + SID + "-note", { opacity: 0 },
              { opacity: 1, duration: 0.6 }, D * 0.76);
          }
          tl.to({}, { duration: D }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["{{ scene_id }}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
