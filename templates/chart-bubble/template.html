<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
<body><template>
  <style>
    {{ base_css }}
    #f-{{ scene_id }} .stage { position: absolute; inset: 0; }
    #f-{{ scene_id }} .kicker {
      position: absolute; left: 8cqw; top: 7cqh;
      font-family: var(--font-mono); font-size: 1.8cqmin;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--coral-deep);
    }
    #f-{{ scene_id }} .headline {
      position: absolute; left: 8cqw; top: 11.5cqh; width: 84cqw;
      font-family: var(--font-display); font-size: 5.4cqmin;
      line-height: 1.1; color: var(--ink);
    }
    #f-{{ scene_id }} .note {
      position: absolute; right: 8cqw; top: 7cqh; width: 26cqw;
      text-align: right; font-family: var(--font-mono);
      font-size: 1.6cqmin; line-height: 1.45; color: var(--ink-faint);
    }
    #f-{{ scene_id }} .bubble-zone {
      position: absolute; left: 11cqw; top: 21cqh;
      width: 78cqw; height: 56cqh;
      border-left: 1px dashed var(--hairline);
      border-bottom: 1px dashed var(--hairline);
    }
    #f-{{ scene_id }} .axis-y {
      position: absolute; left: -10.5cqw; top: -1.2cqh; width: 9.5cqw;
      text-align: right; font-family: var(--font-mono);
      font-size: 1.7cqmin; line-height: 1.35;
      color: var(--ink-faint);
    }
    #f-{{ scene_id }} .axis-x {
      position: absolute; right: 0; bottom: -3.2cqh;
      text-align: right; font-family: var(--font-mono);
      font-size: 1.7cqmin; letter-spacing: 0.06em;
      color: var(--ink-faint); white-space: nowrap;
    }
    #f-{{ scene_id }} .bubble {
      position: absolute; left: var(--x); top: calc(100% - var(--y) * 1%);
      width: calc(var(--sz) * 0.42cqw);
      height: calc(var(--sz) * 0.42cqw);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: color-mix(in srgb, var(--coral) 24%, transparent);
      border: 1.5px solid var(--coral);
      box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
    }
    #f-{{ scene_id }} .bubble-first {
      background: color-mix(in srgb, var(--coral) 30%, transparent);
      border: 2px solid var(--coral-deep);
    }
    #f-{{ scene_id }} .b-name {
      font-family: var(--font-body); font-weight: 600;
      font-size: 1.9cqmin; line-height: 1.15;
      color: var(--ink); text-align: center;
      max-width: 86%; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      word-break: break-word;
    }
    #f-{{ scene_id }} .b-tag {
      position: absolute; left: 50%; bottom: calc(100% + 0.6cqh);
      transform: translateX(-50%);
      font-family: var(--font-mono); font-size: 1.6cqmin;
      color: var(--ink-faint); white-space: nowrap;
    }
    @container frame (max-aspect-ratio: 10/16) {
      #f-{{ scene_id }} .kicker {
        left: 6cqw; top: 6cqh; font-size: 2.6cqmin;
      }
      #f-{{ scene_id }} .headline {
        left: 6cqw; top: 10cqh; width: 88cqw; font-size: 6.4cqmin;
      }
      #f-{{ scene_id }} .note {
        right: 6cqw; top: 6.4cqh; width: 28cqw; font-size: 2.2cqmin;
      }
      #f-{{ scene_id }} .bubble-zone {
        left: 4cqw; top: 25cqh; width: 92cqw; height: 50cqh;
      }
      #f-{{ scene_id }} .axis-y {
        left: 0; top: -5cqh; width: auto; text-align: left; font-size: 2.2cqmin;
      }
      #f-{{ scene_id }} .axis-x {
        bottom: -4cqh; font-size: 2.2cqmin;
      }
      #f-{{ scene_id }} .bubble {
        width: calc(var(--sz) * 0.5cqw);
        height: calc(var(--sz) * 0.5cqw);
      }
      #f-{{ scene_id }} .b-name { font-size: 2.4cqmin; }
      #f-{{ scene_id }} .b-tag { font-size: 2.1cqmin; }
    }
  </style>
  <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
       data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
    <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
    <div class="hf-safe">
      <div class="stage">
        <div class="kicker" id="s-{{ scene_id }}-kicker">{{ fields.get('kicker') }}</div>
        <div class="headline" id="s-{{ scene_id }}-headline">{{ fields.get('headline') }}</div>
        {% if fields.get('note') %}
        <div class="note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>
        {% endif %}
        <div class="bubble-zone" id="s-{{ scene_id }}-zone">
          <div class="axis-y" id="s-{{ scene_id }}-axis-y">{{ fields.get('y_label') }}</div>
          <div class="axis-x" id="s-{{ scene_id }}-axis-x">{{ fields.get('x_label') }}</div>
          {% for raw in fields.get('bubbles') %}
          {% set parts = raw.split('|') %}
          {% set nums = parts[1].split(',') %}
          <div class="bubble{% if loop.index0 == 0 %} bubble-first{% endif %}"
               id="s-{{ scene_id }}-bubble-{{ loop.index0 }}"
               style="--x: {{ nums[0] }}%; --y: {{ nums[1] }}; --sz: {{ nums[2] }};">
            <span class="b-name" id="s-{{ scene_id }}-name-{{ loop.index0 }}">{{ parts[0] }}</span>
            <span class="b-tag" id="s-{{ scene_id }}-tag-{{ loop.index0 }}">{{ parts[0] }}</span>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var SID = "s-{{ scene_id }}";
      var D = {{ duration }};
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#" + SID + "-kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo("#" + SID + "-headline", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.25);
      tl.fromTo("#" + SID + "-axis-y, #" + SID + "-axis-x", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.35);
      {% for raw in fields.get('bubbles') %}
      AM.pop(tl, "#" + SID + "-bubble-{{ loop.index0 }}", {{ 0.5 + loop.index0 * 0.18 }});
      {% endfor %}
      var bsel = [];
      {% for raw in fields.get('bubbles') %}
      bsel.push("#" + SID + "-bubble-{{ loop.index0 }}");
      {% endfor %}
      bsel = bsel.join(", ");
      AM.float(tl, bsel, D * 0.5);
      {% if fields.get('note') %}
      tl.fromTo("#" + SID + "-note", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, D * 0.8);
      {% endif %}
      {% if not is_last %}
      AM.exitSoft(tl, bsel, D);
      {% endif %}
      tl.to({}, { duration: D }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["{{ scene_id }}"] = tl;
    })();
  </script>
</template></body></html>
