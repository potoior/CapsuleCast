<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
<body><template>
  <style>
    {{ base_css }}
    #f-{{ scene_id }} .wc-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 4cqh;
    }
    #f-{{ scene_id }} .wc-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2cqh;
      text-align: center;
    }
    #f-{{ scene_id }} .wc-kicker {
      font-family: var(--font-mono);
      font-size: 2.1cqmin;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--coral-deep);
    }
    #f-{{ scene_id }} .wc-headline {
      margin: 0;
      max-width: 78cqw;
      font-family: var(--font-display);
      font-size: 5.2cqmin;
      font-weight: 700;
      line-height: 1.12;
      color: var(--ink);
    }
    #f-{{ scene_id }} .cloud {
      position: relative;
      flex: none;
      width: 80cqw;
      height: 56cqh;
      margin-top: 1.4cqh;
    }
    #f-{{ scene_id }} .cloud-inner {
      position: absolute;
      inset: 0;
    }
    #f-{{ scene_id }} .word {
      position: absolute;
      transform-origin: 0 0;
      line-height: 1;
    }
    #f-{{ scene_id }} .word-txt {
      display: inline-block;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: var(--font-display);
    }
    #f-{{ scene_id }} .wt-1 { font-size: 2.4cqmin; font-weight: 600; color: var(--ink-faint); }
    #f-{{ scene_id }} .wt-2 { font-size: 3.4cqmin; font-weight: 600; color: var(--ink); }
    #f-{{ scene_id }} .wt-3 { font-size: 4.8cqmin; font-weight: 800; color: var(--coral-deep); }
    #f-{{ scene_id }} .wt-3 .word-txt::after {
      content: "";
      display: block;
      width: 1.6em;
      height: 2px;
      margin: 0.18em auto 0;
      background: var(--coral);
    }
    #f-{{ scene_id }} .pos-0 { left: 50%; top: 26%; }
    #f-{{ scene_id }} .pos-1 { left: 22%; top: 38%; }
    #f-{{ scene_id }} .pos-2 { left: 78%; top: 34%; }
    #f-{{ scene_id }} .pos-3 { left: 36%; top: 56%; }
    #f-{{ scene_id }} .pos-4 { left: 66%; top: 58%; }
    #f-{{ scene_id }} .pos-5 { left: 14%; top: 70%; }
    #f-{{ scene_id }} .pos-6 { left: 86%; top: 68%; }
    #f-{{ scene_id }} .pos-7 { left: 48%; top: 76%; }
    #f-{{ scene_id }} .pos-8 { left: 30%; top: 16%; }
    #f-{{ scene_id }} .wc-note {
      position: absolute;
      left: 0;
      right: 0;
      top: 75.5cqh;
      text-align: center;
      font-family: var(--font-body);
      font-size: 2.1cqmin;
      letter-spacing: 0.04em;
      color: var(--ink-faint);
    }
    @container frame (max-aspect-ratio: 10/16) {
      #f-{{ scene_id }} .wc-stage { padding-top: 3cqh; }
      #f-{{ scene_id }} .wc-headline { max-width: 84cqw; }
      #f-{{ scene_id }} .cloud { width: 92cqw; height: 52cqh; margin-top: 1cqh; }
      #f-{{ scene_id }} .wt-1 { font-size: 2.04cqmin; }
      #f-{{ scene_id }} .wt-2 { font-size: 2.89cqmin; }
      #f-{{ scene_id }} .wt-3 { font-size: 4.08cqmin; }
      #f-{{ scene_id }} .pos-0 { left: 50%; top: 20%; }
      #f-{{ scene_id }} .pos-1 { left: 30%; top: 32%; }
      #f-{{ scene_id }} .pos-2 { left: 70%; top: 30%; }
      #f-{{ scene_id }} .pos-3 { left: 40%; top: 46%; }
      #f-{{ scene_id }} .pos-4 { left: 64%; top: 50%; }
      #f-{{ scene_id }} .pos-5 { left: 22%; top: 62%; }
      #f-{{ scene_id }} .pos-6 { left: 78%; top: 60%; }
      #f-{{ scene_id }} .pos-7 { left: 50%; top: 72%; }
      #f-{{ scene_id }} .pos-8 { left: 30%; top: 12%; }
      #f-{{ scene_id }} .wc-note { top: 74.5cqh; }
    }
  </style>
  <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
       data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
    <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
    <div class="hf-safe">
      <div class="wc-stage">
        <div class="wc-head">
          <div class="wc-kicker" id="s-{{ scene_id }}-kicker">{{ fields.get('kicker') }}</div>
          <h1 class="wc-headline" id="s-{{ scene_id }}-headline">{{ fields.get('headline') }}</h1>
        </div>
        <div class="cloud" id="s-{{ scene_id }}-cloud">
          <div class="cloud-inner" id="s-{{ scene_id }}-cloud-inner">
            {% set ns = namespace(i=0) %}
            {% for wt in ['3', '2', '1'] %}
              {% for item in fields.get('words', []) %}
                {% set parts = item.split('|') %}
                {% if parts[1]|trim == wt %}
                  <div class="word pos-{{ ns.i }}" id="s-{{ scene_id }}-w-{{ ns.i }}">
                    <span class="word-txt wt-{{ wt }}">{{ parts[0]|trim }}</span>
                  </div>
                  {% set ns.i = ns.i + 1 %}
                {% endif %}
              {% endfor %}
            {% endfor %}
          </div>
        </div>
        {% if fields.get('note') %}
        <div class="wc-note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>
        {% endif %}
      </div>
    </div>
  </div>
  <script>
    (function () {
      var SID = "s-{{ scene_id }}";
      var D = {{ duration }};
      var tl = gsap.timeline({ paused: true });

      AM.maskRise(tl, "#" + SID + "-kicker", 0.1);
      AM.maskRise(tl, "#" + SID + "-headline", 0.25);

      var W = [];
      {% set ns = namespace(i=0) %}
      {% for wt in ['3', '2', '1'] %}
        {% for item in fields.get('words', []) %}
          {% set parts = item.split('|') %}
          {% if parts[1]|trim == wt %}
      W.push({ id: "s-{{ scene_id }}-w-{{ ns.i }}", w: {{ wt }} });
            {% set ns.i = ns.i + 1 %}
          {% endif %}
        {% endfor %}
      {% endfor %}

      W.forEach(function (item, i) {
        var at = 0.4 + i * 0.07;
        AM.pop(tl, "#" + item.id, at);
        if (item.w === 3) {
          AM.pulse(tl, "#" + item.id, at + 0.45);
        }
      });

      {% if fields.get('note') %}
      AM.maskRise(tl, "#" + SID + "-note", 0.85 * D);
      {% endif %}

      {% if not is_last %}
      AM.exitSoft(tl, "#" + SID + "-cloud-inner", D);
      {% endif %}

      tl.to({}, { duration: D }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["{{ scene_id }}"] = tl;
    })();
  </script>
</template></body></html>
