<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>{{ scene_id }}</title></head>
<body><template>
  <style>
    {{ base_css }}
    #f-{{ scene_id }} .pt-head {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 1.3cqh; margin-top: 0.6cqh;
    }
    #f-{{ scene_id }} .pt-kicker {
      font-family: var(--font-mono); font-size: 1.7cqmin; line-height: 1;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--coral-deep);
    }
    #f-{{ scene_id }} .hl-wrap { overflow: hidden; padding: 0.4cqh 1cqw; }
    #f-{{ scene_id }} .pt-headline {
      font-family: var(--font-display); font-weight: 700; font-size: 5.2cqmin;
      line-height: 1.1; letter-spacing: -0.02em; color: var(--ink);
    }
    #f-{{ scene_id }} .pt {
      width: 84cqw; margin: 3.2cqh auto 0; display: flex;
      flex-direction: row; align-items: stretch; justify-content: center;
      gap: 2cqw;
    }
    #f-{{ scene_id }} .tier {
      flex: 1 1 0; min-width: 0; position: relative;
      transform-origin: 50% 100%;
    }
    #f-{{ scene_id }} .tier.hot { transform: scale(1.04); z-index: 2; }
    #f-{{ scene_id }} .tier-card {
      position: relative; height: 100%;
      background: var(--cream); border: 1px solid var(--hairline);
      border-radius: var(--tile-radius);
      padding: 3.2cqh 2cqw 2.8cqh;
      box-shadow:
        0 1px 3px color-mix(in srgb, var(--ink) 7%, transparent),
        0 8px 24px color-mix(in srgb, var(--ink) 5%, transparent);
      transform-origin: 50% 50%;
    }
    #f-{{ scene_id }} .tier.hot .tier-card {
      border: 2px solid var(--coral);
      box-shadow:
        0 2px 6px color-mix(in srgb, var(--coral) 18%, transparent),
        0 14px 34px color-mix(in srgb, var(--coral) 16%, transparent);
    }
    #f-{{ scene_id }} .badge {
      position: absolute; top: -1.5cqh; left: 50%; transform: translateX(-50%);
      background: var(--coral); color: var(--cream);
      font-family: var(--font-mono); font-size: 1.3cqmin; line-height: 1;
      letter-spacing: 0.12em; padding: 0.55cqh 1.6cqw; border-radius: 99cqmin;
      white-space: nowrap;
    }
    #f-{{ scene_id }} .t-name {
      font-family: var(--font-body); font-weight: 600; font-size: 2.2cqmin;
      line-height: 1.3; color: var(--ink-soft);
    }
    #f-{{ scene_id }} .t-price {
      font-family: var(--font-display); font-weight: 700; font-size: 4.2cqmin;
      line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums;
      margin-top: 0.7cqh; overflow-wrap: anywhere;
    }
    #f-{{ scene_id }} .tier.hot .t-price { color: var(--coral-deep); }
    #f-{{ scene_id }} .t-feat-empty {
      font-family: var(--font-mono);
      font-size: 1.6cqmin;
      color: var(--ink-soft);
      opacity: 0.85;
    }
    #f-{{ scene_id }} .t-rule {
      height: 0.12cqmin; background: var(--hairline);
      margin: 1.5cqh 0 1.4cqh;
    }
    #f-{{ scene_id }} .t-feat {
      display: flex; align-items: flex-start; gap: 1.1cqw;
      margin-bottom: 0.9cqh; font-family: var(--font-body);
      font-size: 1.8cqmin; line-height: 1.42; color: var(--ink-soft);
    }
    #f-{{ scene_id }} .tf-mark {
      width: 2.4cqmin; height: 2.4cqmin; flex: none; margin-top: 0.25cqh;
      overflow: visible;
    }
    #f-{{ scene_id }} .tf-mark path {
      fill: none; stroke: var(--coral); stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    #f-{{ scene_id }} .pt-note {
      margin: 2.6cqh auto 0; text-align: center;
      font-family: var(--font-mono); font-size: 1.6cqmin;
      letter-spacing: 0.12em; color: var(--ink-faint);
    }
    @container frame (max-aspect-ratio: 10/16) {
      #f-{{ scene_id }} .pt-kicker { font-size: 1.9cqmin; }
      #f-{{ scene_id }} .pt-headline { font-size: 5.2cqmin; }
      #f-{{ scene_id }} .pt {
        width: 92cqw; margin-top: 2.4cqh;
        flex-direction: column; gap: 1.4cqh;
      }
      #f-{{ scene_id }} .tier { width: 100%; }
      #f-{{ scene_id }} .tier.hot { transform: none; }
      #f-{{ scene_id }} .tier-card {
        display: grid; grid-template-columns: auto 1fr; align-items: baseline;
        column-gap: 2.4cqw; padding: 1.7cqh 4cqw 1.5cqh;
      }
      #f-{{ scene_id }} .t-name { grid-column: 1; grid-row: 1; }
      #f-{{ scene_id }} .t-price {
        grid-column: 2; grid-row: 1; justify-self: end;
        margin-top: 0; font-size: 3.8cqmin;
      }
      #f-{{ scene_id }} .t-rule {
        grid-column: 1 / -1; grid-row: 2; margin: 0.8cqh 0 0.9cqh;
      }
      #f-{{ scene_id }} .t-feats {
        grid-column: 1 / -1; grid-row: 3;
        display: flex; flex-wrap: wrap; gap: 0.55cqh 2.4cqw;
      }
      #f-{{ scene_id }} .t-feat {
        flex: 0 0 calc(50% - 1.2cqw); margin-bottom: 0;
        font-size: 1.7cqmin;
      }
      #f-{{ scene_id }} .badge { top: -1.3cqh; }
      #f-{{ scene_id }} .pt-note { margin-top: 1.8cqh; }
    }
  </style>
  <div id="f-{{ scene_id }}" data-composition-id="{{ scene_id }}"
       data-width="{{ width }}" data-height="{{ height }}" data-duration="{{ duration }}">
    <div class="clip hf-ground" id="s-{{ scene_id }}-ground" data-start="0" data-duration="{{ duration }}"></div>
    <div class="hf-safe">
      <div class="pt-head">
        <div class="pt-kicker" id="s-{{ scene_id }}-kicker">{{ fields.get('kicker') }}</div>
        <div class="hl-wrap"><div class="pt-headline" id="s-{{ scene_id }}-headline">{{ fields.get('headline') }}</div></div>
      </div>
      <div class="pt" id="s-{{ scene_id }}-tiers">
        {% for tier in fields.get('tiers') %}
        {% set tp = tier.split('|') %}
        {% set ti = loop.index %}
        <div class="tier{% if ti == 2 %} hot{% endif %}" id="s-{{ scene_id }}-tier-{{ ti }}">
          <div class="tier-card">
            {% if ti == 2 %}<span class="badge" id="s-{{ scene_id }}-badge">推荐</span>{% endif %}
            <div class="t-name">{{ tp[0] }}</div>
            <div class="t-price">{{ tp[1] }}</div>
            <div class="t-rule"></div>
            <div class="t-feats">
              {% set fc = namespace(n=0) %}
              {% for feat in fields.get('features') %}
              {% if (ti|string) in feat.split('|')[1].split(',') %}{% set fc.n = fc.n + 1 %}{% endif %}
              {% endfor %}
              {% if fc.n == 0 %}
              <div class="t-feat t-feat-empty">核心功能可用</div>
              {% endif %}
              {% for feat in fields.get('features') %}
              {% set fp = feat.split('|') %}
              {% if (ti|string) in fp[1].split(',') %}
              <div class="t-feat" id="s-{{ scene_id }}-tf-{{ ti }}-{{ loop.index }}">
                <svg class="tf-mark" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
                  <path id="s-{{ scene_id }}-tick-{{ ti }}-{{ loop.index }}" d="M2 6 L5 9 L10 2" />
                </svg>
                <span>{{ fp[0] }}</span>
              </div>
              {% endif %}
              {% endfor %}
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
      {% if fields.get('note') %}
      <div class="pt-note-wrap">
        <div class="pt-note" id="s-{{ scene_id }}-note">{{ fields.get('note') }}</div>
      </div>
      {% endif %}
    </div>
  </div>
  <script>
    (function () {
      var SID = "s-{{ scene_id }}";
      var D = {{ duration }};
      var tl = gsap.timeline({ paused: true });
      AM.stagger(tl, "#" + SID + "-kicker", 0.1 * D, 0.5, 0);
      AM.maskRise(tl, "#" + SID + "-headline", 0.25 * D, 0.7, 0);
{% for tier in fields.get('tiers') %}
      AM.flipY(tl, "#" + SID + "-tier-{{ loop.index }} .tier-card", 0.4 * D + {{ loop.index0 }} * 0.12, 0.6);
{% endfor %}
      AM.focus(tl, "#" + SID + "-tier-2 .t-price", 0.62 * D, 0.55);
      AM.focus(tl, "#" + SID + "-tier-1 .t-price, #" + SID + "-tier-3 .t-price", 0.66 * D, 0.55);
      AM.stagger(tl, "#" + SID + "-tiers .t-feat", 0.7 * D, 0.5, 0.06);
{% set tk = namespace(k=0) %}
{% for tier in fields.get('tiers') %}
{% set ti = loop.index %}
{% for feat in fields.get('features') %}
{% if (ti|string) in feat.split('|')[1].split(',') %}
      AM.tick(tl, "#" + SID + "-tick-{{ ti }}-{{ loop.index }}", 0.8 * D + {{ tk.k }} * 0.06, 0.4);
{% set tk.k = tk.k + 1 %}
{% endif %}
{% endfor %}
{% endfor %}
{% if fields.get('note') %}
      AM.stagger(tl, "#" + SID + "-note", 0.88 * D, 0.5, 0);
{% endif %}
{% if not is_last %}
      AM.exitSoft(tl, "#" + SID + "-tier-1 .tier-card, #" + SID + "-tier-2 .tier-card, #" + SID + "-tier-3 .tier-card", D);
{% endif %}
      tl.to({}, { duration: D }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["{{ scene_id }}"] = tl;
    })();
  </script>
</template></body></html>
